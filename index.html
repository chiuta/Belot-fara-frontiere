  /* ---------- confirmare (dialog propriu, nu window.confirm) ---------- */

      var no = doc.createElement('button'); no.type = 'button'; no.className = 'fff-btn'; no.textContent = opt.no || T('no');
      var yes = doc.createElement('button'); yes.type = 'button'; yes.className = 'fff-btn fff-primary' + (opt.danger ? ' fff-danger' : ''); yes.textContent = opt.yes || T('yes');

  function ask(msg, c, o) {

  /* ---------- construire ---------- */
  var redactors = [];

  function encrypt(obj, password) {

  function validatePlain(o, slug) {

  /* ---------- API ---------- */
  var bundle = F.bundle = {

    /** Înregistrează fn(cheie, valoare) -> valoare curățată (șir); se aplică doar exportului necriptat. */
    redact: function (fn) { if (typeof fn === 'function') redactors.push(fn); },
    confirm: confirmDlg,

    /** Descarcă un .fff.json. Cu {encrypt:true, password} produce varianta criptată. */
    export: function (opt) {

    import: function (file, opt) {

      return readText(file).then(function (t) {
        var o = parseEnvelope(t);
        if (o.app !== slug) throw BErr('app', {got: o.app, want: slug});
        if (o.format === 'fff-bundle-enc') {
          if (opt.password == null || opt.password === '') throw BErr('password_required', {file: fname});
          return decrypt(o, opt.password).then(function (p) {
            if (p.app !== o.app) throw BErr('format');

          });
        }

      }).then(function (o) {
        var keys = validatePlain(o, slug);
        return ask(T('confirm_import', {n: keys.length, app: slug, ver: o.version || '?', date: (o.exported || '').slice(0, 10) || '?'}), opt.confirm)
          .then(function (ok) {
            if (!ok) return {keys: 0, cancelled: true};
            var undo = {};
            try {
              keys.forEach(function (k) {
                if (!(k in undo)) undo[k] = F.store.raw.get(k);
                F.store.raw.set(k, o.data[k]);

              });
            } catch (e) {
              Object.keys(undo).forEach(function (k) { try { if (undo[k] == null) F.store.raw.remove(k); else F.store.raw.set(k, undo[k]); } catch (e2) { /* ignorat */ } });

          });
      });
    },

    /** Șterge DOAR cheile indexate ale aplicației (și cele fff.<slug>.*). */
    wipe: function (opt) {

      if (!keys.length) return Promise.resolve({keys: 0, cancelled: false});
      return ask(T('confirm_wipe', {n: keys.length}), opt.confirm, {danger: true, yes: T('wipe_yes')}).then(function (ok) {

      });
    }
  };
})();

<title>Belot fără frontiere — atlas și joc contra AI</title>
<style>
:root{
  --bg0:#0d0a08;--bg1:#18120a;--bg2:#2a2010;--panel:#1d160c;--panel2:#261c0f;--line:#4a3a1e;--line2:#6b5428;
  --ink:#f0e8d6;--muted:#c4b79d;--gold:#e8c87a;--gold2:#c8832a;--felt:#143023;--felt2:#0c1c14;
  --card:#f8f1df;--cardink:#1b1710;--cardedge:#b9a77d;--red:#a8231b;--blue:#1b4b94;--green:#14683a;--blk:#16130d;
  --danger:#ff9d8f;--good:#9fe0a6;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --cw:76px;--ch:calc(var(--cw)*1.42);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 55%,var(--bg2) 140%) fixed;color:var(--ink);font-family:var(--serif);line-height:1.55;overflow-x:hidden;min-height:100vh}
body::after{content:"";display:block;height:72px} /* spațiu sub conținut: widgetul fix „Sprijină” nu mai acoperă ultimele butoane */
@media print{body::after{display:none}}
a{color:var(--gold)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #6fb5ff;outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-9999px}.skip:focus{left:8px;top:8px;background:var(--gold);color:#1a1306;padding:8px 12px;z-index:99;border-radius:8px}
header.top{padding:26px 0 8px;border-bottom:1px solid var(--line)}
.kick{font-family:var(--mono);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2)}
h1{font-size:clamp(2rem,6.4vw,3.6rem);line-height:1;margin:.15em 0 .1em;font-weight:700;letter-spacing:.01em}
h1 em{color:var(--gold);font-style:italic;font-weight:600}
.sub{color:var(--muted);max-width:68ch;margin:.2em 0 0;font-size:1.05rem}
.langrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.langrow label{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
select,input[type=text],input[type=number],input[type=search]{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font:inherit;min-height:44px}
nav.tabs{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
nav.tabs button{min-height:44px;padding:8px 18px;border-radius:12px 12px 0 0;background:transparent;border:1px solid var(--line);border-bottom:0;color:var(--muted);font:inherit;cursor:pointer}
nav.tabs button[aria-selected=true]{background:var(--panel2);color:var(--gold);border-color:var(--line2)}
main{padding:20px 0 90px}
.btn{min-height:44px;min-width:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);font:inherit;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,#f0d38a,#c8923a);color:#1c1306;border-color:#e8c87a;font-weight:700}
.btn.gold:hover{filter:brightness(1.06)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 12px;font-size:.92rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--muted);font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--gold);color:#1b1305;border-color:var(--gold);font-weight:700}
.toolrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolrow input[type=search]{flex:1 1 240px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:10px}
.acard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;position:relative}
.acard h3{margin:0;font-size:1.25rem;line-height:1.15}
.acard .aka{color:var(--muted);font-style:italic;font-size:.9rem}
.acard p{margin:0;color:#ddd2bb;font-size:.96rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line2);border-radius:8px;padding:2px 8px;color:var(--muted)}
.badge{font-family:var(--mono);font-size:.74rem;font-weight:700;border-radius:8px;padding:2px 8px;display:inline-block}
.badge.play{background:rgba(232,200,122,.16);color:var(--gold);border:1px solid var(--gold2)}
.badge.atlas{background:rgba(196,183,157,.1);color:var(--muted);border:1px solid var(--line2)}
.badge.warn{background:rgba(255,157,143,.12);color:var(--danger);border:1px solid #a4574c}
.acard .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
dialog{border:1px solid var(--line2);border-radius:18px;background:var(--panel);color:var(--ink);max-width:min(860px,calc(100vw - 20px));width:100%;padding:0;box-shadow:0 30px 80px #000c}
dialog::backdrop{background:rgba(5,3,1,.78)}
.dlg-in{padding:22px;max-height:calc(100vh - 40px);overflow:auto}
.dlg-in h2{margin:0 0 4px;font-size:1.7rem;line-height:1.1}
.dlg-in h3{font-size:.8rem;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.dlg-in ul{margin:0;padding-left:20px}.dlg-in li{margin:4px 0;color:#e4dac4}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0}.facts dt{color:var(--muted);font-family:var(--mono);font-size:.82rem}.facts dd{margin:0}
.warnbox{border:1px solid #a4574c;background:rgba(255,157,143,.07);border-radius:12px;padding:10px 14px;margin-top:12px}
.warnbox strong{color:var(--danger)}
.langnote{font-size:.85rem;color:var(--muted);font-style:italic;margin:6px 0}
.x{position:absolute;right:10px;top:10px}
/* setup */
.setup{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.setup summary{cursor:pointer;font-weight:700;color:var(--gold);min-height:44px;display:flex;align-items:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:10px}
.opt{display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.opt label{color:var(--muted);font-family:var(--mono);font-size:.78rem}
.opt.ck{flex-direction:row;align-items:center;gap:10px;min-height:44px}
.opt.ck input{width:24px;height:24px;flex:none}
.opt.ck label{font-size:.9rem;font-family:var(--serif);color:var(--ink);flex:1;min-height:44px;display:flex;align-items:center;cursor:pointer}
.vnote{font-size:.9rem;color:var(--muted);margin:8px 0 0}
.titlerow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 16px}
.titlerow .langrow{margin-top:0}
body.playing .sub,body.playing .kick{display:none}
body.playing header.top{padding:8px 0 0}
body.playing h1{font-size:1.6rem;margin:0}
body.playing nav.tabs{margin-top:6px}
body.playing main{padding-top:8px}
body.playing .setup{padding:0 14px;margin-bottom:6px}

body.playing .table{padding:6px 10px;gap:2px}
body.playing .s-s .seat{flex-direction:row;gap:8px;align-items:center}
body.playing .s-s .seat .bubble{display:none}
body.playing .seat.turn:before{inset:-2px}
body.playing .center{align-content:center}
body.playing .t-n{margin-bottom:calc(var(--ch)*-0.24)}body.playing .t-s{margin-top:calc(var(--ch)*-0.24)}
body.playing .hud{margin-bottom:6px}
body.playing .score,body.playing .contract{padding:4px 12px}
body.playing .score .vl{font-size:1.5rem}
body.playing .bigsuit{font-size:2rem}
body.playing .status{min-height:0;padding:6px 12px;margin-bottom:6px}
.s-s{grid-area:s;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.s-s .hand{width:100%}
/* masă */
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin-bottom:10px}
.score{flex:1 1 280px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.score .nm{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.score .vl{font-size:1.9rem;font-weight:700;line-height:1;color:var(--gold)}
.score .vl.opp{color:#f0b9ab}
.score .meta{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.contract{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.bigsuit{font-size:2.6rem;line-height:1;width:54px;text-align:center}
.bigsuit.r{color:#ff8d7d}.bigsuit.k{color:#f0e8d6}
.contract .ct{font-size:.9rem;color:var(--muted)}.contract .cv{font-size:1.1rem;font-weight:700}
.status{min-height:2.7em;background:rgba(232,200,122,.08);border:1px solid var(--line2);border-radius:12px;padding:8px 14px;margin-bottom:10px;font-size:1.05rem}
.table{display:grid;grid-template-columns:minmax(74px,1fr) minmax(0,2.4fr) minmax(74px,1fr);grid-template-areas:". n ." "w c e" "s s s";gap:8px;background:radial-gradient(ellipse at 50% 40%,var(--felt) 0%,var(--felt2) 100%);border:2px solid var(--line2);border-radius:22px;padding:12px;box-shadow:inset 0 0 60px rgba(0,0,0,.55)}
.seat{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.seat .nm{font-family:var(--mono);font-size:.75rem;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.seat .nm .pill{display:inline-block;margin-left:4px;padding:0 6px;border-radius:6px;background:rgba(232,200,122,.18);color:var(--gold);font-size:.68rem}
.seat.turn .nm{color:#fff}.seat.turn:before{content:"";position:absolute;inset:-4px;border:2px solid var(--gold);border-radius:14px;opacity:.7;pointer-events:none}
.s-n{grid-area:n}.s-w{grid-area:w;justify-content:center}.s-e{grid-area:e;justify-content:center}.center{grid-area:c}
.backs{display:flex;justify-content:center;min-height:34px}
.back{width:30px;height:42px;border-radius:5px;border:1px solid #9c8452;background:repeating-linear-gradient(45deg,#6d1f1a 0 4px,#8a2d25 4px 8px);margin-left:-18px;box-shadow:0 1px 2px #000a}
.back:first-child{margin-left:0}
.cnt{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.bubble{min-height:1.5em;font-size:.88rem;background:#0008;border:1px solid var(--line2);border-radius:10px;padding:1px 10px;color:var(--ink);opacity:0}
.bubble.on{opacity:1}
.center{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;grid-template-areas:". tn ." "tw tc te" ". ts .";align-items:center;justify-items:center;gap:4px}
.t-n{grid-area:tn}.t-w{grid-area:tw}.t-e{grid-area:te}.t-s{grid-area:ts}.t-c{grid-area:tc;text-align:center;font-size:.8rem;color:var(--muted)}
.slot{width:calc(var(--cw)*0.7);height:calc(var(--ch)*0.7);display:flex;align-items:center;justify-content:center}
.slot .card{width:100%;height:100%;font-size:calc(var(--cw)*0.7*0.3)}
.t-n{margin-bottom:calc(var(--ch)*-0.2)}.t-s{margin-top:calc(var(--ch)*-0.2)}
.slot.win .card{outline:3px solid var(--gold);outline-offset:1px}
.turnup{display:flex;flex-direction:column;align-items:center;gap:2px}
.turnup .card{width:calc(var(--cw)*0.6);height:calc(var(--ch)*0.6);font-size:calc(var(--cw)*0.6*0.28)}
.hand{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:calc(var(--ch) + 10px);padding:6px 0}
.card{position:relative;width:var(--cw);height:var(--ch);border-radius:9px;border:1.5px solid var(--cardedge);background:linear-gradient(160deg,#fffaf0,var(--card));color:var(--cardink);font-family:var(--serif);font-size:calc(var(--cw)*0.3);box-shadow:0 3px 8px rgba(0,0,0,.5);padding:0;cursor:default;display:block;text-align:left;flex:0 0 auto}
.card.r{color:var(--red)}.card.k{color:var(--blk)}
.four .card.d{color:var(--blue)}.four .card.c{color:var(--green)}
.card .tl,.card .br{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1;font-weight:700;font-size:1em}
.card [data-t]::before{content:attr(data-t)}
.card .tl{left:.2em;top:.15em}.card .br{right:.2em;bottom:.15em;transform:rotate(180deg)}
.card .mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.4em;opacity:.92;pointer-events:none}
.card .tl i,.card .br i{font-style:normal;font-size:.9em}
button.card{cursor:pointer;transition:transform .12s}
button.card.legal:hover,button.card.legal:focus-visible{transform:translateY(-10px)}
button.card.legal{box-shadow:0 0 0 2px var(--gold),0 4px 10px rgba(0,0,0,.55)}
button.card.dim{filter:brightness(.62) saturate(.7)}
button.card.hint{outline:4px solid #6fb5ff;outline-offset:2px;transform:translateY(-14px)}
.card.fd{background:repeating-linear-gradient(45deg,#6d1f1a 0 6px,#8a2d25 6px 12px);border-color:#c9ae78}
.mini{--cw:42px;display:inline-block;margin:0 1px;vertical-align:middle}
.hands-open{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:100%}
.hands-open .card{--cw:34px;margin:0}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0;justify-content:center}
.panel{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;margin:10px 0}
.panel h3{margin:0 0 8px;font-size:1rem;color:var(--gold)}
.bidgrid{display:flex;gap:8px;flex-wrap:wrap}
.bidgrid .btn{min-width:64px;font-size:1.05rem}
.bidgrid .btn.red{color:#ff9d8f}
.bidgrid .btn[aria-pressed=true]{background:var(--gold);color:#1a1306;border-color:var(--gold)}
.bidrow{margin:6px 0}
.bidrow .lbl{font-family:var(--mono);font-size:.76rem;color:var(--muted);display:block;margin-bottom:4px}
.log{max-height:150px;overflow:auto;font-size:.9rem;color:#d8ceb6;background:#0007;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.log div{padding:1px 0;border-bottom:1px dashed #ffffff12}
table.res{border-collapse:collapse;width:100%;margin:8px 0}
table.res th,table.res td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
table.res th:first-child,table.res td:first-child{text-align:left}
table.res th{color:var(--gold2);font-family:var(--mono);font-size:.78rem;font-weight:400}
table.res caption{caption-side:top;text-align:left;color:var(--gold2);font-family:var(--mono);font-size:.82rem;padding:10px 0 2px}
table.res tr.tot td{font-weight:700;color:var(--gold);border-top:2px solid var(--line2)}
.resmsg{font-size:1.15rem;margin:6px 0 10px}
.good{color:var(--good)}.bad{color:var(--danger)}
.cmp{overflow-x:auto}
.cmp table{border-collapse:collapse;min-width:900px;font-size:.88rem}
.cmp th,.cmp td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.cmp th{background:var(--panel2);color:var(--gold);font-weight:700;position:sticky;top:0}
.about p,.about li{max-width:78ch}
footer{border-top:1px solid var(--line);padding:26px 0 80px;color:var(--muted);font-size:.9rem}
footer .quote{font-style:italic;color:#d6c9ac}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.learn{border:1px dashed #6fb5ff;border-radius:12px;padding:8px 10px;margin:8px 0;font-size:.9rem;color:#bcd9ff}
@media(max-width:620px){
  :root{--cw:64px}
  .wrap{padding:0 12px}
  .table{padding:8px;gap:6px;grid-template-columns:minmax(60px,1fr) minmax(0,2.6fr) minmax(60px,1fr)}
  .back{width:20px;height:28px;margin-left:-12px}
  .grid{grid-template-columns:1fr}
  .score .vl{font-size:1.6rem}
  .hand{gap:5px}
  dialog{max-width:calc(100vw - 8px)}.dlg-in{padding:16px 14px}
  nav.tabs{flex-wrap:nowrap;gap:4px}nav.tabs button{padding:6px 10px;font-size:.92rem;min-width:0;line-height:1.2}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media(forced-colors:active){.card{border:2px solid CanvasText}}

var BELOT = (function () {
'use strict';

function mulberry32(a) {

var TRX = {"Romanian Belot":["Belot roumain","Belot rumeno","Belot rumano","Belot romeno","Rumänisches Belot","Román belot"],"belota · trump chosen in two rounds":["belota · atout choisi en deux tours","belota · briscola scelta in due giri","belota · triunfo elegido en dos rondas","belota · trunfo escolhido em duas rondas","Belota · Trumpf wird in zwei Runden gewählt","belota · az adut két körben választják"],"Romania, Moldova":["Roumanie, Moldavie","Romania, Moldavia","Rumanía, Moldavia","Roménia, Moldávia","Rumänien, Moldau","Románia, Moldávia"],"The table game of Romania: four players in pairs, 32 cards, trump chosen in two rounds after a turned-up card, declarations (tierce, fifty, hundred, four of a kind, belote) and play to 501 or 1001.":["Le jeu de table de Roumanie : quatre joueurs par équipes de deux, 32 cartes, atout choisi en deux tours après une carte retournée, annonces (tierce, cinquante, cent, carré, belote) et partie en 501 ou 1001 points.","Il gioco da tavolo della Romania: quattro giocatori in coppia, 32 carte, briscola scelta in due giri dopo una carta scoperta, dichiarazioni (terza, cinquanta, cento, poker, belote) e partita a 501 o 1001 punti.","El juego de mesa de Rumanía: cuatro jugadores por parejas, 32 cartas, triunfo elegido en dos rondas tras una carta descubierta, anuncios (tercia, cincuenta, cien, cuatro iguales, belote) y partida a 501 o 1001 puntos.","O jogo de mesa da Roménia: quatro jogadores em pares, 32 cartas, trunfo escolhido em duas rondas depois de uma carta virada, anúncios (terça, cinquenta, cem, quatro iguais, belote) e jogo até 501 ou 1001 pontos.","Das Tischspiel Rumäniens: vier Spieler in Paaren, 32 Karten, Trumpf wird in zwei Runden nach einer aufgedeckten Karte gewählt, Ansagen (Terz, Fünfzig, Hundert, Vierling, Belote) und Spiel bis 501 oder 1001 Punkte.","Románia asztali játéka: négy játékos párokban, 32 lap, az adut két körben választják egy felfordított lap után, bemondások (terc, ötven, száz, négyes, belote), és 501 vagy 1001 pontig játsszák."],"4 (2 vs 2, partners sit opposite)":["4 (2 contre 2, les partenaires sont face à face)","4 (2 contro 2, i compagni siedono di fronte)","4 (2 contra 2, los compañeros se sientan enfrente)","4 (2 contra 2, os parceiros sentam-se em frente um do outro)","4 (2 gegen 2, die Partner sitzen sich gegenüber)","4 (2 a 2 ellen, a társak szemben ülnek)"],"32 cards (7–A)":["32 cartes (7–A)","32 carte (7–A)","32 cartas (7–A)","32 cartas (7–A)","32 Karten (7–A)","32 lap (7–A)"],"The 21st card is turned up. Round 1: each player, starting left of the dealer, says “take” (trump = turned suit) or “pass”. Round 2: name any other suit. The dealer must choose in round 2 (option; otherwise redeal).":["La 21e carte est retournée. Tour 1 : chaque joueur, en commençant à gauche du donneur, dit « je prends » (atout = la couleur retournée) ou « passe ». Tour 2 : on peut nommer une autre couleur. Le donneur doit choisir au tour 2 (option ; sinon, nouvelle donne).","La 21ª carta viene scoperta. Giro 1: ogni giocatore, a partire dalla sinistra del mazziere, dice «prendo» (briscola = seme scoperto) oppure «passo». Giro 2: si può nominare un altro seme. Il mazziere deve scegliere nel giro 2 (opzione; altrimenti si rimescola).","Se descubre la carta 21. Ronda 1: cada jugador, empezando por la izquierda del repartidor, dice «tomo» (triunfo = el palo descubierto) o «paso». Ronda 2: se puede nombrar otro palo. El repartidor debe elegir en la ronda 2 (opción; si no, se vuelve a repartir).","Vira-se a 21.ª carta. Ronda 1: cada jogador, a começar à esquerda do dador, diz «tomo» (trunfo = naipe virado) ou «passo». Ronda 2: pode nomear-se outro naipe. O dador tem de escolher na ronda 2 (opção; caso contrário, volta a dar).","Die 21. Karte wird aufgedeckt. Runde 1: Jeder Spieler, links vom Geber beginnend, sagt „nehmen“ (Trumpf = aufgedeckte Farbe) oder „passe“. Runde 2: Man darf eine andere Farbe nennen. Der Geber muss in Runde 2 wählen (Option; sonst wird neu gegeben).","Felfordítják a 21. lapot. 1. kör: minden játékos, az osztótól balra kezdve, azt mondja: „viszem” (adu = a felfordított szín) vagy „passz”. 2. kör: más színt is megnevezhet. Az osztónak a 2. körben választania kell (opció; különben újraosztás)."],"Follow suit; if you cannot, trump; if already trumped, overtrump if you can; if your partner is winning you need not trump (default; option: must trump even over a winning partner, as on belot.md). If trump is led, play a higher trump if you have one.":["Fournir la couleur demandée ; sinon couper ; si l'on a déjà coupé, surcouper si possible ; si le partenaire est maître, on n'est pas obligé de couper (par défaut ; option : couper obligatoirement même sur le partenaire, comme sur belot.md). Si l'atout est demandé, jouer un atout plus fort si l'on en a.","Rispondere al seme richiesto; se non si può, tagliare; se qualcuno ha già tagliato, sovrataglio se possibile; se il compagno sta vincendo non si è obbligati a tagliare (predefinito; opzione: tagliare obbligatoriamente anche sul compagno, come su belot.md). Se si gioca briscola, si gioca una briscola più alta se la si ha.","Servir el palo pedido; si no se puede, fallar; si ya se ha fallado, sobrefallar si se puede; si el compañero va ganando no hay obligación de fallar (por defecto; opción: fallar obligatoriamente incluso sobre el compañero, como en belot.md). Si se juega triunfo, hay que jugar un triunfo más alto si se tiene.","Assistir ao naipe pedido; se não puder, cortar; se já foi cortado, sobrecortar se puder; se o parceiro estiver a ganhar, não é obrigado a cortar (predefinição; opção: cortar obrigatoriamente mesmo sobre o parceiro, como em belot.md). Se se jogar trunfo, joga-se um trunfo mais alto se o tiver.","Die ausgespielte Farbe bedienen; wer nicht kann, sticht mit Trumpf; wurde schon gestochen, wird übertrumpft, wenn möglich; liegt der Partner im Stich vorn, muss man nicht stechen (Standard; Option: auch über den Partner hinweg stechen müssen, wie auf belot.md). Wird Trumpf ausgespielt, ist ein höherer Trumpf zu geben, wenn man einen hat.","Színt kell vallani; ha nem lehet, ütni kell adúval; ha már ütötték, felülütni, ha lehet; ha a társ nyer, nem kötelező ütni (alapértelmezés; opció: a nyerő társ fölé is kötelező ütni, mint a belot.md-n). Ha adút indítanak, nagyobb adút kell tenni, ha van."],"Tierce 20, fifty 50, hundred 100 (5+ in sequence), four of a kind: J 200, 9 150, A/10/K/Q 100; belote (K+Q of trump) 20. Declarations are made with the first card played, belote only with the second card of the pair; best declaration wins, a tie cancels (option: first in rotation).":["Tierce 20, cinquante 50, cent 100 (5 cartes ou plus à la suite), carré : valet 200, 9 150, as/10/roi/dame 100 ; belote (roi + dame d'atout) 20. Les annonces se font avec la première carte jouée, la belote seulement avec la seconde carte de la paire ; la meilleure annonce l'emporte, une égalité les annule (option : le premier dans l'ordre de rotation).","Terza 20, cinquanta 50, cento 100 (5 o più consecutive), poker di pari: J 200, 9 150, A/10/K/Q 100; belote (K+Q di briscola) 20. Le dichiarazioni si fanno con la prima carta giocata, la belote solo con la seconda carta della coppia; vince la dichiarazione migliore, la parità le annulla (opzione: il primo in ordine di rotazione).","Tercia 20, cincuenta 50, cien 100 (5 o más seguidas), cuatro iguales: J 200, 9 150, A/10/K/Q 100; belote (K+Q de triunfo) 20. Los anuncios se hacen con la primera carta jugada, el belote solo con la segunda carta de la pareja; gana el mejor anuncio, un empate los anula (opción: el primero en el orden de rotación).","Terça 20, cinquenta 50, cem 100 (5 ou mais seguidas), quatro iguais: J 200, 9 150, A/10/K/Q 100; belote (K+Q de trunfo) 20. Os anúncios fazem-se com a primeira carta jogada, o belote apenas com a segunda carta do par; ganha o melhor anúncio, um empate anula-os (opção: o primeiro na rotação).","Terz 20, Fünfzig 50, Hundert 100 (5 oder mehr in Folge), Vierling: Bube 200, 9 150, Ass/10/König/Dame 100; Belote (König + Dame im Trumpf) 20. Ansagen erfolgen mit der ersten gespielten Karte, die Belote erst mit der zweiten Karte des Paares; die beste Ansage gewinnt, bei Gleichstand heben sie sich auf (Option: der Erste in der Reihenfolge).","Terc 20, ötven 50, száz 100 (5 vagy több egymás után), négyes: J 200, 9 150, A/10/K/Q 100; belote (az adu K+Q) 20. A bemondás az első kijátszott lappal történik, a belote csak a pár második lapjával; a legjobb bemondás nyer, döntetlennél kioltják egymást (opció: a sorrendben első)."],"152 card points + 10 last trick = 162":["152 points de cartes + 10 de dernier pli = 162","152 punti di carte + 10 ultima presa = 162","152 puntos de cartas + 10 de la última baza = 162","152 pontos de cartas + 10 da última vaza = 162","152 Kartenpunkte + 10 für den letzten Stich = 162","152 lappont + 10 az utolsó ütésért = 162"],"501 or 1001 points (configurable)":["501 ou 1001 points (configurable)","501 o 1001 punti (configurabile)","501 o 1001 puntos (configurable)","501 ou 1001 pontos (configurável)","501 oder 1001 Punkte (einstellbar)","501 vagy 1001 pont (beállítható)"],"Trump: J 20, 9 14, A 11, 10 10, K 4, Q 3, 8 and 7 = 0. Plain suits: A 11, 10 10, K 4, Q 3, J 2, 9/8/7 = 0. Trump order: J, 9, A, 10, K, Q, 8, 7; plain order: A, 10, K, Q, J, 9, 8, 7.":["Atout : valet 20, 9 14, as 11, 10 10, roi 4, dame 3, 8 et 7 = 0. Couleurs simples : as 11, 10 10, roi 4, dame 3, valet 2, 9/8/7 = 0. Ordre à l'atout : valet, 9, as, 10, roi, dame, 8, 7 ; ordre aux couleurs simples : as, 10, roi, dame, valet, 9, 8, 7.","Briscola: J 20, 9 14, A 11, 10 10, K 4, Q 3, 8 e 7 = 0. Semi normali: A 11, 10 10, K 4, Q 3, J 2, 9/8/7 = 0. Ordine di forza in briscola: J, 9, A, 10, K, Q, 8, 7; nei semi normali: A, 10, K, Q, J, 9, 8, 7.","Triunfo: J 20, 9 14, A 11, 10 10, K 4, Q 3, 8 y 7 = 0. Palos normales: A 11, 10 10, K 4, Q 3, J 2, 9/8/7 = 0. Orden de fuerza en triunfo: J, 9, A, 10, K, Q, 8, 7; en palos normales: A, 10, K, Q, J, 9, 8, 7.","Trunfo: J 20, 9 14, A 11, 10 10, K 4, Q 3, 8 e 7 = 0. Naipes normais: A 11, 10 10, K 4, Q 3, J 2, 9/8/7 = 0. Ordem de força no trunfo: J, 9, A, 10, K, Q, 8, 7; nos naipes normais: A, 10, K, Q, J, 9, 8, 7.","Trumpf: Bube 20, 9 14, Ass 11, 10 10, König 4, Dame 3, 8 und 7 = 0. Nebenfarben: Ass 11, 10 10, König 4, Dame 3, Bube 2, 9/8/7 = 0. Rangfolge im Trumpf: Bube, 9, Ass, 10, König, Dame, 8, 7; in den Nebenfarben: Ass, 10, König, Dame, Bube, 9, 8, 7.","Adu: J 20, 9 14, A 11, 10 10, K 4, Q 3, 8 és 7 = 0. Nem adu színek: A 11, 10 10, K 4, Q 3, J 2, 9/8/7 = 0. Erősorrend aduban: J, 9, A, 10, K, Q, 8, 7; nem adu színekben: A, 10, K, Q, J, 9, 8, 7."],"Five cards each, the 21st is turned up. The player who picks trump takes the turned card, then all fill up to 8.":["Chacun reçoit cinq cartes, la 21e est retournée. Le joueur qui choisit l'atout prend la carte retournée, puis tous complètent jusqu'à 8 cartes.","Si danno 5 carte a testa, si scopre la 21ª. Chi sceglie la briscola prende la carta scoperta, poi tutti completano a 8 carte.","Se reparten 5 cartas a cada uno y se descubre la 21. Quien elige el triunfo se lleva la carta descubierta, y luego todos completan hasta 8 cartas.","Dão-se 5 cartas a cada um e vira-se a 21.ª. Quem escolhe o trunfo fica com a carta virada, depois todos completam até 8 cartas.","Jeder erhält fünf Karten, die 21. wird aufgedeckt. Wer den Trumpf wählt, nimmt die aufgedeckte Karte, danach füllen alle auf 8 Karten auf.","Mindenki 5 lapot kap, a 21.-et felfordítják. Aki az adut választja, magához veszi a felfordított lapot, majd mindenki 8 lapra egészíti ki a kezét."],"The player left of the dealer leads. The trick winner leads the next.":["Le joueur à gauche du donneur entame. Le gagnant d'un pli entame le suivant.","Inizia il giocatore a sinistra del mazziere. Chi vince una presa apre la successiva.","Sale el jugador a la izquierda del repartidor. El ganador de una baza sale en la siguiente.","Começa o jogador à esquerda do dador. O vencedor de uma vaza abre a seguinte.","Der Spieler links vom Geber kommt heraus. Der Stichgewinner spielt zum nächsten Stich aus.","Az osztótól balra ülő játékos indít. Az ütés nyertese indítja a következőt."],"Declarations are made with the player’s first card. A team that wins no trick loses its declarations. Belote (K+Q of trump) is announced only when you play the second card of the pair (nothing is said on the first) and scores even if the team loses.":["Les annonces se font avec la première carte jouée par le joueur. Une équipe qui ne fait aucun pli perd ses annonces. La belote (roi + dame d'atout) s'annonce seulement en jouant la seconde carte de la paire (on ne dit rien à la première) et compte même si l'équipe perd.","Le dichiarazioni si fanno con la prima carta giocata dal giocatore. La squadra che non fa nessuna presa perde le sue dichiarazioni. La belote (K+Q di briscola) si annuncia solo quando si gioca la seconda carta della coppia (alla prima non si dice nulla) e si segna anche se la squadra perde.","Los anuncios se hacen con la primera carta que juega el jugador. Un equipo que no gana ninguna baza pierde sus anuncios. El belote (K+Q de triunfo) se anuncia solo al jugar la segunda carta de la pareja (con la primera no se dice nada) y puntúa aunque el equipo pierda.","Os anúncios fazem-se com a primeira carta jogada pelo jogador. Uma equipa que não ganhe nenhuma vaza perde os seus anúncios. O belote (K+Q de trunfo) só se anuncia ao jogar a segunda carta do par (na primeira não se diz nada) e pontua mesmo que a equipa perca.","Ansagen erfolgen mit der ersten Karte, die der Spieler ausspielt. Ein Team ohne Stich verliert seine Ansagen. Die Belote (König + Dame im Trumpf) wird erst angesagt, wenn man die zweite Karte des Paares spielt (bei der ersten sagt man nichts) und zählt auch dann, wenn das Team verliert.","A bemondást a játékos az első kijátszott lapjával teszi. Az a csapat, amelyik nem nyer ütést, elveszti a bemondásait. A belote-ot (az adu K+Q) csak a pár második lapjának kijátszásakor kell bemondani (az elsőnél nem szólnak semmit), és akkor is számít, ha a csapat veszít."],"Half / fall (rule chosen and documented here): the player who picked trump needs at least as many as the opponents (cards + last trick + declarations + belote). With fewer he “falls”: the opponents take all points of the hand and his team keeps only the belote. A tie counts as made.":["Moitié / chute (règle choisie et documentée ici) : le preneur doit avoir au moins autant de points que les adversaires (cartes + dernier pli + annonces + belote). S'il en a moins, il « chute » : les adversaires prennent tous les points de la donne et son équipe ne garde que la belote. Une égalité compte comme contrat rempli.","Metà / caduta (regola scelta e documentata qui): chi ha scelto la briscola deve avere almeno tanti punti quanti gli avversari (carte + ultima presa + dichiarazioni + belote). Se ne ha meno, «cade»: gli avversari prendono tutti i punti della mano e la sua squadra tiene solo la belote. La parità vale come riuscita.","Mitad / caída (regla elegida y documentada aquí): quien eligió el triunfo necesita al menos tantos puntos como los rivales (cartas + última baza + anuncios + belote). Si tiene menos, «cae»: los rivales se llevan todos los puntos de la mano y su equipo conserva solo el belote. El empate cuenta como cumplido.","Metade / queda (regra escolhida e documentada aqui): quem escolheu o trunfo precisa de, pelo menos, tantos pontos como os adversários (cartas + última vaza + anúncios + belote). Se tiver menos, «cai»: os adversários ficam com todos os pontos da mão e a sua equipa guarda apenas o belote. O empate conta como cumprido.","Hälfte / Fall (hier gewählte und dokumentierte Regel): Wer den Trumpf gewählt hat, braucht mindestens so viele Punkte wie die Gegner (Karten + letzter Stich + Ansagen + Belote). Hat er weniger, „fällt“ er: Die Gegner erhalten alle Punkte der Runde, und sein Team behält nur die Belote. Gleichstand gilt als geschafft.","Fele / bukás (az itt választott és dokumentált szabály): aki az adut választotta, annyi pontot kell hogy szerezzen, mint az ellenfelek (lapok + utolsó ütés + bemondások + belote). Ha kevesebbet, „bukik”: az ellenfelek viszik a leosztás összes pontját, az ő csapata csak a belote-ot tartja meg. Az egyenlőség teljesítettnek számít."],"Capot (all 8 tricks): +90 for the team taking them (total 252). If the opponents take all tricks the bidder falls.":["Capot (les 8 plis) : +90 pour l'équipe qui les fait (total 252). Si les adversaires font capot, le preneur chute.","Cappotto (tutte e 8 le prese): +90 per la squadra che le fa (totale 252). Se gli avversari fanno cappotto, chi ha chiamato cade.","Capote (las 8 bazas): +90 para el equipo que las gana (total 252). Si los rivales hacen capote, quien eligió el triunfo cae.","Capote (as 8 vazas): +90 para a equipa que as faz (total 252). Se os adversários fizerem capote, quem escolheu o trunfo cai.","Capot (alle 8 Stiche): +90 für das Team, das sie holt (insgesamt 252). Machen die Gegner Capot, fällt der Bieter.","Capot (mind a 8 ütés): +90 a csapatnak, amelyik megnyeri őket (összesen 252). Ha az ellenfelek viszik az összes ütést, a licitáló bukik."],"There is no single national rulebook in Romania: tables differ on “half”, tie handling, balls vs exact points, the swap of the 7, the bizon and mid-hand declarations.":["Il n'existe pas de règlement national unique en Roumanie : les tables diffèrent sur la « moitié », le traitement de l'égalité, les boules ou les points exacts, l'échange du 7, le bizon et les annonces en cours de donne.","In Romania non esiste un regolamento nazionale unico: i tavoli differiscono su «la metà», sul trattamento della parità, su bile o punti esatti, sullo scambio del 7, sul bizon e sulle dichiarazioni a mano in corso.","En Rumanía no existe un reglamento nacional único: las mesas difieren en la «mitad», el tratamiento del empate, bolas o puntos exactos, el cambio del 7, el bizon y los anuncios durante la mano.","Na Roménia não existe um regulamento nacional único: as mesas diferem na «metade», no tratamento do empate, em bolas ou pontos exatos, na troca do 7, no bizon e nos anúncios a meio da mão.","In Rumänien gibt es kein einheitliches nationales Regelwerk: Die Tische unterscheiden sich bei der „Hälfte“, beim Umgang mit Gleichstand, bei Kugeln oder exakten Punkten, beim Tausch der 7, beim Bizon und bei Ansagen während der Runde.","Romániában nincs egységes országos szabálykönyv: az asztalok eltérnek a „felében”, az egyenlőség kezelésében, a golyók és a pontos pontok kérdésében, a hetes cseréjében, a bizonban és a menet közbeni bemondásokban."],"belot.md (Moldova) uses balls (10 points = 1 ball) plus bizon / 7-swap rules; Pagat (Belote) sets the contract at >81 and treats a tie as “litige”.":["belot.md (Moldavie) utilise des boules (10 points = 1 boule) ainsi que les règles du bizon et de l'échange du 7 ; Pagat (Belote) fixe le contrat à plus de 81 et traite l'égalité comme un « litige ».","belot.md (Moldavia) usa le bile (10 punti = 1 bila) più le regole del bizon e dello scambio del 7; Pagat (Belote) fissa il contratto a più di 81 e tratta la parità come «litige».","belot.md (Moldavia) usa bolas (10 puntos = 1 bola) y reglas de bizon y de cambio del 7; Pagat (Belote) fija el contrato en más de 81 y trata el empate como «litige».","O belot.md (Moldávia) usa bolas (10 pontos = 1 bola) e regras de bizon e de troca do 7; o Pagat (Belote) fixa o contrato em mais de 81 e trata o empate como «litige».","belot.md (Moldau) verwendet Kugeln (10 Punkte = 1 Kugel) sowie Bizon- und 7-Tausch-Regeln; Pagat (Belote) setzt den Kontrakt auf mehr als 81 und behandelt Gleichstand als „litige“.","A belot.md (Moldávia) golyókat használ (10 pont = 1 golyó), valamint bizon- és hetescsere-szabályokat; a Pagat (Belote) a szerződést 81 fölé teszi, és az egyenlőséget „litige”-nek tekinti."],"No official rule exists: “half”/fall is the author’s documented choice.":["Il n'existe pas de règle officielle : la « moitié »/chute est le choix documenté de l'auteur.","Non esiste una regola ufficiale: la «metà»/caduta è la scelta documentata dell'autore.","No existe una regla oficial: la «mitad»/caída es la elección documentada del autor.","Não existe regra oficial: a «metade»/queda é a escolha documentada do autor.","Es gibt keine offizielle Regel: „Hälfte“/Fall ist die dokumentierte Wahl des Autors.","Nincs hivatalos szabály: a „fele”/bukás a szerző dokumentált választása."],"No balls (exact points are scored), no swap of the 7, no bizon.":["Pas de boules (on compte en points exacts), pas d'échange du 7 et pas de bizon.","Niente bile (si segnano punti esatti), niente scambio del 7 e niente bizon.","Sin bolas (se puntúa en puntos exactos), sin cambio del 7 y sin bizon.","Sem bolas (pontua-se em pontos exatos), sem troca do 7 e sem bizon.","Keine Kugeln (es wird in exakten Punkten gezählt), kein Tausch der 7 und kein Bizon.","Nincsenek golyók (pontos pontokat számolnak), nincs hetescsere és nincs bizon."],"The turned-up card always goes to the player who picks trump (also in round 2).":["La carte retournée va toujours au joueur qui choisit l'atout (y compris au tour 2).","La carta scoperta va sempre a chi sceglie la briscola (anche nel giro 2).","La carta descubierta va siempre a quien elige el triunfo (también en la ronda 2).","A carta virada vai sempre para quem escolhe o trunfo (também na ronda 2).","Die aufgedeckte Karte geht immer an den Spieler, der den Trumpf wählt (auch in Runde 2).","A felfordított lap mindig ahhoz kerül, aki az adut választja (a 2. körben is)."],"Declarations are made only with the first card; there is no late declaration. The term “24” for capot could not be verified in a source and is not used.":["Les annonces se font uniquement avec la première carte ; il n'y a pas d'annonce tardive. Le terme « 24 » pour le capot n'a pu être vérifié dans une source et n'est pas utilisé.","Le dichiarazioni si fanno solo con la prima carta; non esiste la dichiarazione tardiva. Il termine «24» per il cappotto non è stato verificato in una fonte e non viene usato.","Los anuncios se hacen solo con la primera carta; no hay anuncio tardío. El término «24» para el capote no se pudo verificar en ninguna fuente y no se usa.","Os anúncios fazem-se apenas com a primeira carta; não há anúncio tardio. O termo «24» para o capote não pôde ser verificado numa fonte e não é usado.","Ansagen erfolgen nur mit der ersten Karte; eine verspätete Ansage gibt es nicht. Der Begriff „24“ für Capot konnte in keiner Quelle bestätigt werden und wird nicht verwendet.","Bemondani csak az első lappal lehet; késői bemondás nincs. A capot „24” megnevezését nem sikerült forrásban ellenőrizni, ezért nem használjuk."],"Disputed: when the partner is winning you are exempt from trumping (Pagat, belot.bg) or must trump (belot.md) — default exempt, switchable in the options. Equal declarations: both cancelled (belot.md, belot.bg) or first in rotation (Pagat) — default cancelled, switchable.":["Point disputé : quand le partenaire est maître, on est dispensé de couper (Pagat, belot.bg) ou obligé de couper (belot.md) — par défaut dispensé, modifiable dans les options. Annonces égales : toutes deux annulées (belot.md, belot.bg) ou le premier dans l'ordre de rotation (Pagat) — par défaut annulées, modifiable.","Punto controverso: se il compagno sta vincendo si è esentati dal tagliare (Pagat, belot.bg) oppure obbligati a tagliare (belot.md) — predefinito: esentati, modificabile dalle opzioni. Dichiarazioni uguali: entrambe annullate (belot.md, belot.bg) oppure il primo in rotazione (Pagat) — predefinito: annullate, modificabile.","Punto discutido: cuando el compañero va ganando, se está exento de fallar (Pagat, belot.bg) u obligado a fallar (belot.md) — por defecto exento, modificable en las opciones. Anuncios iguales: se anulan ambos (belot.md, belot.bg) o gana el primero en rotación (Pagat) — por defecto anulados, modificable.","Ponto disputado: quando o parceiro está a ganhar, fica-se dispensado de cortar (Pagat, belot.bg) ou obrigado a cortar (belot.md) — por predefinição dispensado, alterável nas opções. Anúncios iguais: ambos anulados (belot.md, belot.bg) ou o primeiro na rotação (Pagat) — por predefinição anulados, alterável.","Umstritten: Liegt der Partner im Stich vorn, ist man vom Stechen befreit (Pagat, belot.bg) oder muss stechen (belot.md) — Standard: befreit, in den Optionen umstellbar. Gleiche Ansagen: beide entfallen (belot.md, belot.bg) oder der Erste in der Reihenfolge gewinnt (Pagat) — Standard: entfallen, umstellbar.","Vitatott: ha a társ nyer, mentes az ember az ütés alól (Pagat, belot.bg), vagy ütnie kell (belot.md) — alapértelmezés: mentes, az opciókban átállítható. Egyenlő bemondások: mindkettő érvénytelen (belot.md, belot.bg), vagy a sorrendben első nyer (Pagat) — alapértelmezés: érvénytelen, átállítható."],"Belote is announced only with the second card (Romanian rule as requested by the author); other variants announce it with the first card (Belote, Bela) per Pagat.":["La belote s'annonce seulement avec la seconde carte (règle roumaine demandée par l'auteur) ; les autres variantes l'annoncent avec la première carte (Belote, Bela) selon Pagat.","La belote si annuncia solo con la seconda carta (regola rumena richiesta dall'autore); le altre varianti la annunciano con la prima carta (Belote, Bela) secondo Pagat.","El belote se anuncia solo con la segunda carta (regla rumana pedida por el autor); las demás variantes lo anuncian con la primera carta (Belote, Bela) según Pagat.","O belote anuncia-se apenas com a segunda carta (regra romena pedida pelo autor); as outras variantes anunciam-no com a primeira carta (Belote, Bela), segundo o Pagat.","Die Belote wird erst mit der zweiten Karte angesagt (rumänische Regel, vom Autor gewünscht); die anderen Varianten sagen sie laut Pagat mit der ersten Karte an (Belote, Bela).","A belote-ot csak a második lappal mondják be (a szerző által kért román szabály); a többi változatban a Pagat szerint az első lappal (Belote, Bela)."],"Turned card, 2 rounds":["Carte retournée, 2 tours","Carta scoperta, 2 giri","Carta descubierta, 2 rondas","Carta virada, 2 rondas","Aufgedeckte Karte, 2 Runden","Felfordított lap, 2 kör"],"Follow, trump, overtrump; partner exempts":["Fournir, couper, surcouper ; le partenaire dispense","Rispondere, tagliare, sovratagliare; il compagno esenta","Servir, fallar, sobrefallar; el compañero exime","Assistir, cortar, sobrecortar; o parceiro dispensa","Bedienen, stechen, übertrumpfen; Partner befreit","Színt vallani, ütni, felülütni; a társ felment"],"Seq./carré/belote; tie = cancel":["Séquence/carré/belote ; égalité = annulation","Sequenza/poker/belote; parità = annullamento","Secuencia/cuatro iguales/belote; empate = anulación","Sequência/quatro iguais/belote; empate = anulação","Folge/Vierling/Belote; Gleichstand = Aufhebung","Sor/négyes/belote; döntetlen = kioltás"],"Fall: opponents take all":["Chute : les adversaires prennent tout","Caduta: gli avversari prendono tutto","Caída: los rivales se llevan todo","Queda: os adversários ficam com tudo","Fall: Gegner erhalten alles","Bukás: az ellenfelek viszik az egészet"],"Classic Belote (France)":["Belote classique (France)","Belote classica (Francia)","Belote clásica (Francia)","Belote clássica (França)","Klassische Belote (Frankreich)","Klasszikus belote (Franciaország)"],"belote · belote classique":["belote · belote classique","belote · belote classique","belote · belote classique","belote · belote classique","belote · belote classique","belote · belote classique"],"France":["France","Francia","Francia","França","Frankreich","Franciaország"],"French Belote: same deck and values, trump in two rounds, declarations with “rotation” on ties, play to 1000. If nobody takes trump the hand is redealt.":["Belote française : mêmes cartes et valeurs, atout en deux tours, annonces avec « rotation » en cas d'égalité, partie en 1000 points. Si personne ne prend, la donne est rejouée.","Belote francese: stesso mazzo e stessi valori, briscola in due giri, dichiarazioni con «rotazione» in caso di parità, partita a 1000. Se nessuno prende la briscola, si rimescola.","Belote francesa: misma baraja y valores, triunfo en dos rondas, anuncios con «rotación» en caso de empate, partida a 1000. Si nadie toma el triunfo, se vuelve a repartir.","Belote francesa: mesmo baralho e valores, trunfo em duas rondas, anúncios com «rotação» em caso de empate, jogo até 1000. Se ninguém tomar o trunfo, volta a dar-se.","Französische Belote: gleiches Blatt und gleiche Werte, Trumpf in zwei Runden, Ansagen mit „Rotation“ bei Gleichstand, Spiel bis 1000. Nimmt niemand den Trumpf, wird neu gegeben.","Francia belote: ugyanaz a pakli és ugyanazok az értékek, adu két körben, bemondások „rotációval” döntetlen esetén, 1000 pontig. Ha senki nem vállalja az adut, újraosztás."],"4 (2 vs 2)":["4 (2 contre 2)","4 (2 contro 2)","4 (2 contra 2)","4 (2 contra 2)","4 (2 gegen 2)","4 (2 a 2 ellen)"],"32 cards":["32 cartes","32 carte","32 cartas","32 cartas","32 Karten","32 lap"],"As in Romanian belot, but nobody is forced in round 2: if all pass the hand is redealt.":["Comme au belot roumain, mais personne n'est forcé au tour 2 : si tous passent, on redonne.","Come nel belot rumeno, ma nessuno è obbligato nel giro 2: se tutti passano si rimescola.","Como en el belot rumano, pero nadie está obligado en la ronda 2: si todos pasan, se vuelve a repartir.","Como no belot romeno, mas ninguém é obrigado na ronda 2: se todos passarem, volta a dar-se.","Wie beim rumänischen Belot, aber niemand ist in Runde 2 gezwungen: Wenn alle passen, wird neu gegeben.","Mint a román belotnál, de a 2. körben senkit nem kényszerítenek: ha mindenki passzol, újraosztás."],"Follow, trump, overtrump; a winning partner exempts you from trumping.":["Fournir, couper, surcouper ; un partenaire maître vous dispense de couper.","Rispondere, tagliare, sovratagliare; un compagno che sta vincendo vi esenta dal tagliare.","Servir, fallar, sobrefallar; un compañero que va ganando te exime de fallar.","Assistir, cortar, sobrecortar; um parceiro que esteja a ganhar dispensa-o de cortar.","Bedienen, stechen, übertrumpfen; ein Partner, der den Stich gewinnt, befreit Sie vom Stechen.","Színt vallani, ütni, felülütni; ha a társ nyer, nem kell ütnie."],"Tierce 20, quarte 50, quinte 100, carré (J 200, 9 150, A/10/K/Q 100), belote-rebelote 20. Tie: the declarer nearest the dealer wins (rotation).":["Tierce 20, quarte 50, quinte 100, carré (valet 200, 9 150, as/10/roi/dame 100), belote-rebelote 20. Égalité : le déclarant le plus proche du donneur l'emporte (rotation).","Terza 20, quarta 50, quinta 100, poker di pari (J 200, 9 150, A/10/K/Q 100), belote-rebelote 20. Parità: vince il dichiarante più vicino al mazziere (rotazione).","Tercia 20, cuarta 50, quinta 100, cuatro iguales (J 200, 9 150, A/10/K/Q 100), belote-rebelote 20. Empate: gana el que anuncia más cerca del repartidor (rotación).","Terça 20, quarta 50, quinta 100, quatro iguais (J 200, 9 150, A/10/K/Q 100), belote-rebelote 20. Empate: ganha quem anuncia mais perto do dador (rotação).","Terz 20, Quart 50, Quint 100, Vierling (Bube 200, 9 150, Ass/10/König/Dame 100), Belote-Rebelote 20. Gleichstand: Der Ansager, der dem Geber am nächsten sitzt, gewinnt (Rotation).","Terc 20, kvart 50, kvint 100, négyes (J 200, 9 150, A/10/K/Q 100), belote-rebelote 20. Döntetlen: az osztóhoz legközelebb ülő bemondó nyer (rotáció)."],"162 (152 + 10 “dix de der”)":["162 (152 + 10 de « dix de der »)","162 (152 + 10 di «dix de der»)","162 (152 + 10 de «dix de der»)","162 (152 + 10 de «dix de der»)","162 (152 + 10 „dix de der“)","162 (152 + 10 „dix de der”)"],"1000 (501/1500 optional)":["1000 (501/1500 en option)","1000 (501/1500 opzionale)","1000 (501/1500 opcional)","1000 (501/1500 opcional)","1000 (501/1500 optional)","1000 (501/1500 opcionális)"],"Values and order as in Romanian belot.":["Valeurs et ordre comme au belot roumain.","Valori e ordine come nel belot rumeno.","Valores y orden como en el belot rumano.","Valores e ordem como no belot romeno.","Werte und Rangfolge wie beim rumänischen Belot.","Az értékek és a sorrend mint a román belotnál."],"Trump in two rounds after the turned card; if nobody takes, the hand is redealt.":["Atout en deux tours après la carte retournée ; si personne ne prend, on redonne.","Briscola in due giri dopo la carta scoperta; se nessuno la prende, si rimescola.","Triunfo en dos rondas tras la carta descubierta; si nadie lo toma, se vuelve a repartir.","Trunfo em duas rondas depois da carta virada; se ninguém tomar, volta a dar-se.","Trumpf in zwei Runden nach der aufgedeckten Karte; nimmt niemand, wird neu gegeben.","Adu két körben a felfordított lap után; ha senki nem viszi, újraosztás."],"The contract is made if the taking team has at least as many points as the opponents; otherwise the opponents take all points.":["Le contrat est rempli si l'équipe preneuse a au moins autant de points que les adversaires ; sinon les adversaires prennent tous les points.","Il contratto è riuscito se la squadra che ha preso ha almeno tanti punti quanti gli avversari; altrimenti gli avversari prendono tutti i punti.","El contrato se cumple si el equipo que tomó tiene al menos tantos puntos como los rivales; si no, los rivales se llevan todos los puntos.","O contrato é cumprido se a equipa que tomou tiver, pelo menos, tantos pontos como os adversários; caso contrário, os adversários ficam com todos os pontos.","Der Kontrakt ist erfüllt, wenn das nehmende Team mindestens so viele Punkte hat wie die Gegner; sonst erhalten die Gegner alle Punkte.","A szerződés teljesült, ha a vállaló csapat legalább annyi pontot szerez, mint az ellenfelek; különben az ellenfelek viszik az összes pontot."],"Capot +90.":["Capot +90.","Cappotto +90.","Capote +90.","Capote +90.","Capot +90.","Capot +90."],"Pagat gives the contract as “more than 81”; at 81–81 the taker’s points are held (“litige”) and go to whoever wins the next hand.":["Pagat donne le contrat à « plus de 81 » ; à 81–81, les points du preneur sont suspendus (« litige ») et vont à celui qui gagne la donne suivante.","Pagat indica il contratto come «più di 81»; a 81–81 i punti di chi ha preso restano sospesi («litige») e vanno a chi vince la mano successiva.","Pagat da el contrato como «más de 81»; con 81–81 los puntos de quien tomó quedan en suspenso («litige») y pasan a quien gane la mano siguiente.","O Pagat indica o contrato como «mais de 81»; a 81–81 os pontos de quem tomou ficam em suspenso («litige») e passam para quem ganhar a mão seguinte.","Pagat gibt den Kontrakt mit „mehr als 81“ an; bei 81–81 werden die Punkte des Nehmers zurückgehalten („litige“) und gehen an den Gewinner der nächsten Runde.","A Pagat a szerződést „több mint 81”-ként adja meg; 81–81-nél a vállaló pontjait visszatartják („litige”), és a következő leosztás nyertesére szállnak."],"A 81–81 tie does not apply “litige” (taker is considered to have made it); same rule as Romanian belot.":["Une égalité 81–81 n'applique pas le « litige » (le preneur est considéré comme ayant réussi) ; même règle qu'au belot roumain.","Una parità 81–81 non applica il «litige» (chi ha preso è considerato riuscito); stessa regola del belot rumeno.","Un empate 81–81 no aplica el «litige» (se considera que quien tomó cumplió); misma regla que en el belot rumano.","Um empate 81–81 não aplica o «litige» (considera-se que quem tomou cumpriu); mesma regra do belot romeno.","Ein 81–81-Gleichstand wendet kein „litige“ an (der Nehmer gilt als erfolgreich); dieselbe Regel wie beim rumänischen Belot.","A 81–81-es döntetlen nem alkalmazza a „litige”-t (a vállalót teljesítettnek tekintik); ugyanaz a szabály, mint a román belotnál."],"The score is kept in exact points, not on a ball scoresheet.":["Le score est tenu en points exacts, pas sur une feuille de marque à boules.","Il punteggio si tiene in punti esatti, non su un foglio a bile.","La puntuación se lleva en puntos exactos, no en una hoja de bolas.","A pontuação é feita em pontos exatos, não numa folha de bolas.","Es wird in exakten Punkten gezählt, nicht auf einem Kugel-Zettel.","A pontozás pontos pontokban történik, nem golyós lapon."],"Turned card, 2 rounds, redeal":["Carte retournée, 2 tours, redonne","Carta scoperta, 2 giri, rimescolamento","Carta descubierta, 2 rondas, nuevo reparto","Carta virada, 2 rondas, nova distribuição","Aufgedeckte Karte, 2 Runden, Neugabe","Felfordított lap, 2 kör, újraosztás"],"Follow, trump, overtrump":["Fournir, couper, surcouper","Rispondere, tagliare, sovratagliare","Servir, fallar, sobrefallar","Assistir, cortar, sobrecortar","Bedienen, stechen, übertrumpfen","Színt vallani, ütni, felülütni"],"Same; tie = rotation":["Idem ; égalité = rotation","Uguale; parità = rotazione","Igual; empate = rotación","Igual; empate = rotação","Gleich; Gleichstand = Rotation","Ugyanaz; döntetlen = rotáció"],"Opponents take all":["Les adversaires prennent tout","Gli avversari prendono tutto","Los rivales se llevan todo","Os adversários ficam com tudo","Gegner erhalten alles","Az ellenfelek viszik az egészet"],"Belote contrée (Coinche)":["Belote contrée (Coinche)","Belote contrée (Coinche)","Belote contrée (Coinche)","Belote contrée (Coinche)","Belote contrée (Coinche)","Belote contrée (Coinche)"],"Belote with a real auction: players bid a contract (80–160 or capot 250) with a trump suit; opponents may “contre” and the bidding side “surcontre”. Scoring depends on the contract.":["Belote avec de vraies enchères : les joueurs annoncent un contrat (80–160 ou capot 250) avec une couleur d'atout ; les adversaires peuvent « contrer » et l'équipe qui a enchéri « surcontrer ». La marque dépend du contrat.","Belote con una vera licitazione: i giocatori dichiarano un contratto (80–160 o cappotto 250) con un seme di briscola; gli avversari possono dire «contre» e chi ha licitato «surcontre». Il punteggio dipende dal contratto.","Belote con una subasta de verdad: los jugadores pujan un contrato (80–160 o capote 250) con un palo de triunfo; los rivales pueden decir «contre» y el bando que pujó «surcontre». La puntuación depende del contrato.","Belote com um leilão a sério: os jogadores licitam um contrato (80–160 ou capote 250) com um naipe de trunfo; os adversários podem dizer «contre» e o lado licitante «surcontre». A pontuação depende do contrato.","Belote mit einer echten Reizung: Die Spieler bieten einen Kontrakt (80–160 oder Capot 250) mit einer Trumpffarbe; die Gegner dürfen „contre“ sagen und die bietende Seite „surcontre“. Die Wertung hängt vom Kontrakt ab.","Belote igazi licitálással: a játékosok szerződést licitálnak (80–160 vagy capot 250) egy adu színnel; az ellenfelek „contre”-t mondhatnak, a licitáló oldal „surcontre”-t. A pontozás a szerződéstől függ."],"32 cards, 8 each":["32 cartes, 8 chacun","32 carte, 8 a testa","32 cartas, 8 cada uno","32 cartas, 8 cada um","32 Karten, je 8","32 lap, fejenként 8"],"Bids from 80 in steps of 10 up to 160, or capot (250). Three passes after a bid end it. “Contre” by the opponents, “surcontre” by the bidding side.":["Enchères à partir de 80 par paliers de 10 jusqu'à 160, ou capot (250). Trois passes après une enchère y mettent fin. « Contre » par les adversaires, « surcontre » par l'équipe qui a enchéri.","Offerte da 80 con incrementi di 10 fino a 160, oppure cappotto (250). Tre passi dopo un'offerta la chiudono. «Contre» da parte degli avversari, «surcontre» da parte di chi ha licitato.","Pujas desde 80 de 10 en 10 hasta 160, o capote (250). Tres pasos tras una puja la cierran. «Contre» de los rivales, «surcontre» del bando que pujó.","Licitações a partir de 80, de 10 em 10, até 160, ou capote (250). Três passes após uma licitação terminam-na. «Contre» pelos adversários, «surcontre» pelo lado licitante.","Gebote ab 80 in Zehnerschritten bis 160 oder Capot (250). Drei Pässe nach einem Gebot beenden die Reizung. „Contre“ durch die Gegner, „Surcontre“ durch die bietende Seite.","Licit 80-tól tízesével 160-ig, vagy capot (250). Egy licit után három passz lezárja. „Contre” az ellenfelektől, „surcontre” a licitáló oldaltól."],"Follow, trump, overtrump (a winning partner exempts you from trumping).":["Fournir, couper, surcouper (un partenaire maître vous dispense de couper).","Rispondere, tagliare, sovratagliare (un compagno che sta vincendo vi esenta dal tagliare).","Servir, fallar, sobrefallar (un compañero que va ganando te exime de fallar).","Assistir, cortar, sobrecortar (um parceiro que esteja a ganhar dispensa-o de cortar).","Bedienen, stechen, übertrumpfen (ein Partner, der den Stich gewinnt, befreit Sie vom Stechen).","Színt vallani, ütni, felülütni (ha a társ nyer, nem kell ütnie)."],"Belote-rebelote 20 is active. Sequences and carrés are optional (off by default).":["Belote-rebelote 20 est active. Les séquences et carrés sont optionnels (désactivés par défaut).","La belote-rebelote 20 è attiva. Sequenze e poker di pari sono opzionali (disattivati per impostazione predefinita).","El belote-rebelote 20 está activo. Las secuencias y los cuatro iguales son opcionales (desactivados por defecto).","O belote-rebelote 20 está ativo. As sequências e os quatro iguais são opcionais (desativados por predefinição).","Belote-Rebelote 20 ist aktiv. Folgen und Vierlinge sind optional (standardmäßig aus).","A belote-rebelote 20 aktív. A sorok és a négyesek opcionálisak (alapértelmezés szerint kikapcsolva)."],"162 + 90 capot":["162 + 90 de capot","162 + 90 di cappotto","162 + 90 de capote","162 + 90 de capote","162 + 90 Capot","162 + 90 capot"],"2000 (1000/1500/3000 optional)":["2000 (1000/1500/3000 en option)","2000 (1000/1500/3000 opzionale)","2000 (1000/1500/3000 opcional)","2000 (1000/1500/3000 opcional)","2000 (1000/1500/3000 optional)","2000 (1000/1500/3000 opcionális)"],"The contract is made if the bidding side scores at least the bid (cards + last trick + belote + any declarations). Capot (250) needs all tricks.":["Le contrat est rempli si l'équipe qui a enchéri marque au moins sa mise (cartes + dernier pli + belote + éventuelles annonces). Le capot (250) exige tous les plis.","Il contratto è riuscito se la squadra che ha licitato totalizza almeno l'offerta (carte + ultima presa + belote + eventuali dichiarazioni). Il cappotto (250) richiede tutte le prese.","El contrato se cumple si el bando que pujó logra al menos su puja (cartas + última baza + belote + anuncios, si los hay). El capote (250) exige todas las bazas.","O contrato é cumprido se o lado licitante fizer, pelo menos, o valor licitado (cartas + última vaza + belote + eventuais anúncios). O capote (250) exige todas as vazas.","Der Kontrakt ist erfüllt, wenn die bietende Seite mindestens ihr Gebot erreicht (Karten + letzter Stich + Belote + etwaige Ansagen). Für Capot (250) sind alle Stiche nötig.","A szerződés teljesült, ha a licitáló oldal legalább a licitált értéket eléri (lapok + utolsó ütés + belote + esetleges bemondások). A capothoz (250) minden ütés kell."],"Made: each side takes its own points rounded to 10; the bidder adds the contract × (1, 2 or 4 after contre).":["Contrat rempli : chaque camp prend ses propres points arrondis à la dizaine ; le preneur ajoute le contrat × (1, 2 ou 4 après contre).","Riuscito: ogni parte prende i propri punti arrotondati a 10; chi ha licitato aggiunge il contratto × (1, 2 o 4 dopo il contre).","Cumplido: cada bando se lleva sus propios puntos redondeados a 10; quien pujó suma el contrato × (1, 2 o 4 tras el contre).","Cumprido: cada lado fica com os seus pontos arredondados à dezena; o licitante soma o contrato × (1, 2 ou 4 após o contre).","Erfüllt: Jede Seite erhält ihre eigenen, auf 10 gerundeten Punkte; der Bieter addiert den Kontrakt × (1, 2 oder 4 nach Contre).","Teljesült: mindkét oldal a saját, tízesre kerekített pontjait kapja; a licitáló hozzáadja a szerződést × (1, 2 vagy 4 contre után)."],"Failed: the defenders take 160 + contract × (1, 2 or 4); the bidder keeps only belote. A failed capot gives the defenders 500.":["Contrat chuté : les défenseurs prennent 160 + contrat × (1, 2 ou 4) ; le preneur ne garde que la belote. Un capot chuté donne 500 aux défenseurs.","Fallito: i difensori prendono 160 + contratto × (1, 2 o 4); chi ha licitato tiene solo la belote. Un cappotto fallito dà 500 ai difensori.","Fallido: los defensores se llevan 160 + contrato × (1, 2 o 4); quien pujó conserva solo el belote. Un capote fallido da 500 a los defensores.","Falhado: os defensores ficam com 160 + contrato × (1, 2 ou 4); o licitante guarda apenas o belote. Um capote falhado dá 500 aos defensores.","Verfehlt: Die Verteidiger erhalten 160 + Kontrakt × (1, 2 oder 4); der Bieter behält nur die Belote. Ein verfehltes Capot gibt den Verteidigern 500.","Elbukott: a védők 160 + szerződés × (1, 2 vagy 4) pontot kapnak; a licitáló csak a belote-ot tartja meg. Az elbukott capot 500-at ad a védőknek."],"Contre is called by the opponents while the auction is open; surcontre by the bidding side.":["Le contre est annoncé par les adversaires tant que les enchères sont ouvertes ; le surcontre par l'équipe qui a enchéri.","Il contre lo dicono gli avversari finché la licitazione è aperta; il surcontre chi ha licitato.","El contre lo dicen los rivales mientras la subasta sigue abierta; el surcontre, el bando que pujó.","O contre é dito pelos adversários enquanto o leilão está aberto; o surcontre, pelo lado licitante.","Contre wird von den Gegnern gesagt, solange die Reizung offen ist; Surcontre von der bietenden Seite.","A contre-t az ellenfelek mondják, amíg a licit nyitott; a surcontre-t a licitáló oldal."],"Failed capot: some sources give 500, others 410 (160 + 250). Here: 500. Declarations (tierce etc.) are played differently between clubs.":["Capot chuté : certaines sources donnent 500, d'autres 410 (160 + 250). Ici : 500. Les annonces (tierce, etc.) se jouent différemment selon les clubs.","Cappotto fallito: alcune fonti indicano 500, altre 410 (160 + 250). Qui: 500. Le dichiarazioni (terza ecc.) si giocano in modo diverso da club a club.","Capote fallido: unas fuentes dan 500, otras 410 (160 + 250). Aquí: 500. Los anuncios (tercia, etc.) se juegan de forma distinta según los clubes.","Capote falhado: algumas fontes indicam 500, outras 410 (160 + 250). Aqui: 500. Os anúncios (terça, etc.) jogam-se de forma diferente consoante os clubes.","Verfehltes Capot: Manche Quellen nennen 500, andere 410 (160 + 250). Hier: 500. Ansagen (Terz usw.) werden von Klub zu Klub unterschiedlich gespielt.","Elbukott capot: egyes források 500-at, mások 410-et (160 + 250) adnak. Itt: 500. A bemondásokat (terc stb.) klubonként másképp játsszák."],"Sequence/carré declarations are off by default and, when enabled, follow classic belote rules, not every contrée nuance.":["Les annonces de séquence/carré sont désactivées par défaut et, si on les active, suivent les règles de la belote classique, pas toutes les nuances de la contrée.","Le dichiarazioni di sequenza/poker sono disattivate per impostazione predefinita e, se attivate, seguono le regole della belote classica, non tutte le sfumature della contrée.","Los anuncios de secuencia/cuatro iguales están desactivados por defecto y, al activarlos, siguen las reglas de la belote clásica, no todos los matices de la contrée.","Os anúncios de sequência/quatro iguais estão desativados por predefinição e, quando ativados, seguem as regras da belote clássica, não todas as nuances da contrée.","Folgen-/Vierling-Ansagen sind standardmäßig aus und folgen, wenn aktiviert, den Regeln der klassischen Belote, nicht jeder Feinheit der Contrée.","A sor-/négyes-bemondások alapértelmezés szerint ki vannak kapcsolva, és bekapcsolva a klasszikus belote szabályait követik, nem a contrée minden finomságát."],"No “sans atout” / “tout atout” (absent from classic contrée, present in modern variants).":["Pas de « sans atout » / « tout atout » (absents de la contrée classique, présents dans les variantes modernes).","Niente «sans atout» / «tout atout» (assenti dalla contrée classica, presenti nelle varianti moderne).","Sin «sans atout» / «tout atout» (ausentes de la contrée clásica, presentes en variantes modernas).","Sem «sans atout» / «tout atout» (ausentes da contrée clássica, presentes em variantes modernas).","Kein „sans atout“ / „tout atout“ (in der klassischen Contrée nicht vorhanden, in modernen Varianten schon).","Nincs „sans atout” / „tout atout” (a klasszikus contrée-ban hiányzik, a modern változatokban megvan)."],"Failed capot: 500 (documented choice).":["Capot chuté : 500 (choix documenté).","Cappotto fallito: 500 (scelta documentata).","Capote fallido: 500 (elección documentada).","Capote falhado: 500 (escolha documentada).","Verfehltes Capot: 500 (dokumentierte Wahl).","Elbukott capot: 500 (dokumentált választás)."],"Auction 80–160, capot, contre/surcontre":["Enchères 80–160, capot, contre/surcontre","Licitazione 80–160, cappotto, contre/surcontre","Subasta 80–160, capote, contre/surcontre","Leilão 80–160, capote, contre/surcontre","Reizung 80–160, Capot, Contre/Surcontre","Licit 80–160, capot, contre/surcontre"],"Belote only (rest optional)":["Belote seulement (le reste en option)","Solo belote (il resto opzionale)","Solo belote (lo demás opcional)","Só belote (o resto opcional)","Nur Belote (Rest optional)","Csak belote (a többi opcionális)"],"Defenders: 160 + contract × mult.":["Défenseurs : 160 + contrat × multiplicateur","Difensori: 160 + contratto × moltiplicatore","Defensores: 160 + contrato × multiplicador","Defensores: 160 + contrato × multiplicador","Verteidiger: 160 + Kontrakt × Multiplikator","Védők: 160 + szerződés × szorzó"],"Bela (Croatia / Serbia)":["Bela (Croatie / Serbie)","Bela (Croazia / Serbia)","Bela (Croacia / Serbia)","Bela (Croácia / Sérvia)","Bela (Kroatien / Serbien)","Bela (Horvátország / Szerbia)"],"Croatia, Bosnia, Serbia":["Croatie, Bosnie, Serbie","Croazia, Bosnia, Serbia","Croacia, Bosnia, Serbia","Croácia, Bósnia, Sérvia","Kroatien, Bosnien, Serbien","Horvátország, Bosznia, Szerbia"],"The Balkan belot: six cards are dealt, each player names trump or says “dalje” (pass) – the last must name; fill to eight. The caller needs strictly more than the opponents and you must trump even over a partner.":["Le belot des Balkans : on distribue six cartes, chaque joueur nomme l'atout ou dit « dalje » (passe) – le dernier doit nommer ; on complète à huit. Le preneur doit avoir strictement plus que les adversaires et l'on doit couper même sur son partenaire.","Il belot balcanico: si danno sei carte, ogni giocatore nomina la briscola o dice «dalje» (passo) – l'ultimo deve nominare; si completa a otto. Chi chiama deve avere strettamente più degli avversari e si deve tagliare anche sul compagno.","El belot de los Balcanes: se reparten seis cartas, cada jugador nombra el triunfo o dice «dalje» (paso) – el último debe nombrarlo; se completa hasta ocho. Quien llama necesita estrictamente más que los rivales y hay que fallar incluso sobre el compañero.","O belot dos Balcãs: dão-se seis cartas, cada jogador nomeia o trunfo ou diz «dalje» (passo) – o último tem de nomear; completa-se até oito. Quem chama precisa de estritamente mais do que os adversários e é obrigatório cortar mesmo sobre o parceiro.","Das Balkan-Belot: Es werden sechs Karten gegeben, jeder Spieler nennt den Trumpf oder sagt „dalje“ (passe) – der Letzte muss nennen; dann wird auf acht aufgefüllt. Der Ansager braucht strikt mehr als die Gegner, und man muss auch über den Partner hinweg stechen.","A balkáni belot: hat lapot osztanak, mindenki megnevezi az adut vagy azt mondja „dalje” (passz) – az utolsónak meg kell neveznie; nyolcra egészítik ki. A hívónak szigorúan többet kell szereznie, mint az ellenfeleknek, és a társ fölé is kötelező ütni."],"6 cards; in turn, name a suit or “dalje”; the last is forced. Then 2 more cards.":["6 cartes ; chacun à son tour nomme une couleur ou « dalje » ; le dernier est forcé. Puis 2 cartes de plus.","6 carte; a turno si nomina un seme o «dalje»; l'ultimo è obbligato. Poi altre 2 carte.","6 cartas; por turno se nombra un palo o «dalje»; el último está obligado. Luego 2 cartas más.","6 cartas; à vez, nomeia-se um naipe ou «dalje»; o último é obrigado. Depois mais 2 cartas.","6 Karten; der Reihe nach eine Farbe nennen oder „dalje“; der Letzte ist gezwungen. Dann 2 weitere Karten.","6 lap; sorban színt kell mondani vagy „dalje”-t; az utolsó kényszerítve van. Aztán még 2 lap."],"Follow, trump, overtrump; you must trump even if your partner is winning.":["Fournir, couper, surcouper ; on doit couper même si le partenaire est maître.","Rispondere, tagliare, sovratagliare; si deve tagliare anche se il compagno sta vincendo.","Servir, fallar, sobrefallar; hay que fallar aunque el compañero vaya ganando.","Assistir, cortar, sobrecortar; é obrigatório cortar mesmo que o parceiro esteja a ganhar.","Bedienen, stechen, übertrumpfen; man muss auch stechen, wenn der Partner den Stich gewinnt.","Színt vallani, ütni, felülütni; akkor is ütni kell, ha a társ nyer."],"Zvanje: 20/50/100/four of a kind, bela 20. Tie: rotation.":["Zvanje : 20/50/100/carré, bela 20. Égalité : rotation.","Zvanje: 20/50/100/poker di pari, bela 20. Parità: rotazione.","Zvanje: 20/50/100/cuatro iguales, bela 20. Empate: rotación.","Zvanje: 20/50/100/quatro iguais, bela 20. Empate: rotação.","Zvanje: 20/50/100/Vierling, Bela 20. Gleichstand: Rotation.","Zvanje: 20/50/100/négyes, bela 20. Döntetlen: rotáció."],"162, štiglja (capot) +90":["162, štiglja (capot) +90","162, štiglja (cappotto) +90","162, štiglja (capote) +90","162, štiglja (capote) +90","162, Štiglja (Capot) +90","162, štiglja (capot) +90"],"1001 (501 optional)":["1001 (501 en option)","1001 (501 opzionale)","1001 (501 opcional)","1001 (501 opcional)","1001 (501 optional)","1001 (501 opcionális)"],"The caller needs strictly more points than the opponents, otherwise he “falls” and the opponents take everything.":["Le preneur doit avoir strictement plus de points que les adversaires, sinon il « chute » et les adversaires prennent tout.","Chi chiama deve avere strettamente più punti degli avversari, altrimenti «cade» e gli avversari prendono tutto.","Quien llama necesita estrictamente más puntos que los rivales; si no, «cae» y los rivales se llevan todo.","Quem chama precisa de estritamente mais pontos do que os adversários; caso contrário «cai» e os adversários ficam com tudo.","Der Ansager braucht strikt mehr Punkte als die Gegner, sonst „fällt“ er und die Gegner erhalten alles.","A hívónak szigorúan több pontot kell szereznie, mint az ellenfeleknek, különben „bukik”, és az ellenfelek viszik az egészet."],"The obligation to trump applies even if the partner is winning the trick.":["L'obligation de couper s'applique même si le partenaire est maître du pli.","L'obbligo di tagliare vale anche se il compagno sta vincendo la presa.","La obligación de fallar se aplica aunque el compañero vaya ganando la baza.","A obrigação de cortar aplica-se mesmo que o parceiro esteja a ganhar a vaza.","Die Stechpflicht gilt auch dann, wenn der Partner den Stich gewinnt.","Az ütési kötelezettség akkor is érvényes, ha a társ nyeri az ütést."],"Štiglja (all tricks): +90.":["Štiglja (tous les plis) : +90.","Štiglja (tutte le prese): +90.","Štiglja (todas las bazas): +90.","Štiglja (todas as vazas): +90.","Štiglja (alle Stiche): +90.","Štiglja (minden ütés): +90."],"Variants call trump after seeing all eight cards or give special value to four sevens; only the 6-card base game is implemented.":["Certaines variantes appellent l'atout après avoir vu les huit cartes ou donnent une valeur spéciale aux quatre sept ; seul le jeu de base à 6 cartes est implémenté.","Alcune varianti chiamano la briscola dopo aver visto tutte e otto le carte o danno un valore speciale ai quattro sette; è implementato solo il gioco base a 6 carte.","Algunas variantes llaman al triunfo tras ver las ocho cartas o dan un valor especial a los cuatro sietes; solo está implementado el juego base de 6 cartas.","Algumas variantes chamam o trunfo depois de ver as oito cartas ou dão um valor especial aos quatro setes; só o jogo base de 6 cartas está implementado.","Manche Varianten rufen den Trumpf erst nach Ansicht aller acht Karten aus oder geben vier Siebenen einen Sonderwert; implementiert ist nur das 6-Karten-Grundspiel.","Egyes változatok mind a nyolc lap megnézése után hívják az adut, vagy különleges értéket adnak a négy hetesnek; csak a 6 lapos alapjáték van megvalósítva."],"No “open bela” (open cards) and no rules for 2–3 players.":["Pas de « bela ouverte » (cartes ouvertes) et pas de règles pour 2–3 joueurs.","Niente «bela aperta» (carte scoperte) e niente regole per 2–3 giocatori.","Sin «bela abierta» (cartas descubiertas) y sin reglas para 2–3 jugadores.","Sem «bela aberta» (cartas à vista) e sem regras para 2–3 jogadores.","Keine „offene Bela“ (offene Karten) und keine Regeln für 2–3 Spieler.","Nincs „nyitott bela” (nyitott lapok), és nincsenek szabályok 2–3 játékosra."],"No regional scoresheet nuance (“pisanje”): exact points.":["Aucune nuance régionale de feuille de marque (« pisanje ») : points exacts.","Nessuna sfumatura regionale del punteggio («pisanje»): punti esatti.","Sin matices regionales de anotación («pisanje»): puntos exactos.","Sem nuances regionais de marcação («pisanje»): pontos exatos.","Keine regionalen Feinheiten der Zählweise („pisanje“): exakte Punkte.","Nincs regionális pontozási árnyalat („pisanje”): pontos pontok."],"6 cards, suit or dalje":["6 cartes, couleur ou dalje","6 carte, seme o dalje","6 cartas, palo o dalje","6 cartas, naipe ou dalje","6 Karten, Farbe oder dalje","6 lap, szín vagy dalje"],"Trump even over partner":["Couper même sur le partenaire","Tagliare anche sul compagno","Fallar incluso sobre el compañero","Cortar mesmo sobre o parceiro","Auch über den Partner stechen","A társ fölé is ütni"],"Zvanje, rotation":["Zvanje, rotation","Zvanje, rotazione","Zvanje, rotación","Zvanje, rotação","Zvanje, Rotation","Zvanje, rotáció"],"Strictly more; else opponents take all":["Strictement plus ; sinon les adversaires prennent tout","Strettamente di più; altrimenti gli avversari prendono tutto","Estrictamente más; si no, los rivales se llevan todo","Estritamente mais; caso contrário os adversários ficam com tudo","Strikt mehr; sonst erhalten die Gegner alles","Szigorúan több; különben az ellenfelek viszik az egészet"],"Klaverjas (Amsterdam)":["Klaverjas (Amsterdam)","Klaverjas (Amsterdam)","Klaverjas (Ámsterdam)","Klaverjas (Amesterdão)","Klaverjas (Amsterdam)","Klaverjas (Amszterdam)"],"Netherlands":["Pays-Bas","Paesi Bassi","Países Bajos","Países Baixos","Niederlande","Hollandia"],"Dutch Klaverjas: bonuses (“roem”) are scored per trick, plus stuk (K+Q of trump) and pit (all tricks). Sixteen hands are played; the team that chose trump must beat the opponents, otherwise “nat”.":["Klaverjas néerlandais : les bonus (« roem ») se marquent pli par pli, avec en plus le stuk (roi + dame d'atout) et le pit (tous les plis). On joue seize donnes ; l'équipe qui a choisi l'atout doit battre les adversaires, sinon c'est « nat ».","Klaverjas olandese: i bonus («roem») si segnano a ogni presa, più lo stuk (K+Q di briscola) e il pit (tutte le prese). Si giocano sedici mani; la squadra che ha scelto la briscola deve battere gli avversari, altrimenti è «nat».","Klaverjas neerlandés: las bonificaciones («roem») se puntúan por baza, además del stuk (K+Q de triunfo) y el pit (todas las bazas). Se juegan dieciséis manos; el equipo que eligió el triunfo debe superar a los rivales, o es «nat».","Klaverjas neerlandês: as bonificações («roem») pontuam-se por vaza, além do stuk (K+Q de trunfo) e do pit (todas as vazas). Jogam-se dezasseis mãos; a equipa que escolheu o trunfo tem de superar os adversários, caso contrário é «nat».","Niederländisches Klaverjas: Boni („Roem“) werden pro Stich gezählt, dazu Stuk (König + Dame im Trumpf) und Pit (alle Stiche). Es werden sechzehn Runden gespielt; das Team, das den Trumpf
