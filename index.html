<title>Belot fără frontiere — atlas și joc contra AI</title>
<style>
:root{
  --bg0:#0d0a08;--bg1:#18120a;--bg2:#2a2010;--panel:#1d160c;--panel2:#261c0f;--line:#4a3a1e;--line2:#6b5428;
  --ink:#f0e8d6;--muted:#c4b79d;--gold:#e8c87a;--gold2:#c8832a;--felt:#143023;--felt2:#0c1c14;
  --card:#f8f1df;--cardink:#1b1710;--cardedge:#b9a77d;--red:#a8231b;--blue:#1b4b94;--green:#14683a;--blk:#16130d;
  --danger:#ff9d8f;--good:#9fe0a6;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --cw:76px;--ch:calc(var(--cw)*1.42);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 55%,var(--bg2) 140%) fixed;color:var(--ink);font-family:var(--serif);line-height:1.55;overflow-x:hidden;min-height:100vh}
body::after{content:"";display:block;height:72px} /* spațiu sub conținut: widgetul fix „Sprijină” nu mai acoperă ultimele butoane */
@media print{body::after{display:none}}
a{color:var(--gold)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #6fb5ff;outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-9999px}.skip:focus{left:8px;top:8px;background:var(--gold);color:#1a1306;padding:8px 12px;z-index:99;border-radius:8px}
header.top{padding:26px 0 8px;border-bottom:1px solid var(--line)}
.kick{font-family:var(--mono);font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2)}
h1{font-size:clamp(2rem,6.4vw,3.6rem);line-height:1;margin:.15em 0 .1em;font-weight:700;letter-spacing:.01em}
h1 em{color:var(--gold);font-style:italic;font-weight:600}
.sub{color:var(--muted);max-width:68ch;margin:.2em 0 0;font-size:1.05rem}
.langrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.langrow label{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
select,input[type=text],input[type=number],input[type=search]{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font:inherit;min-height:44px}
nav.tabs{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
nav.tabs button{min-height:44px;padding:8px 18px;border-radius:12px 12px 0 0;background:transparent;border:1px solid var(--line);border-bottom:0;color:var(--muted);font:inherit;cursor:pointer}
nav.tabs button[aria-selected=true]{background:var(--panel2);color:var(--gold);border-color:var(--line2)}
main{padding:20px 0 90px}
.btn{min-height:44px;min-width:44px;padding:8px 16px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);font:inherit;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,#f0d38a,#c8923a);color:#1c1306;border-color:#e8c87a;font-weight:700}
.btn.gold:hover{filter:brightness(1.06)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 12px;font-size:.92rem}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--muted);font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--gold);color:#1b1305;border-color:var(--gold);font-weight:700}
.toolrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolrow input[type=search]{flex:1 1 240px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:10px}
.acard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;position:relative}
.acard h3{margin:0;font-size:1.25rem;line-height:1.15}
.acard .aka{color:var(--muted);font-style:italic;font-size:.9rem}
.acard p{margin:0;color:#ddd2bb;font-size:.96rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line2);border-radius:8px;padding:2px 8px;color:var(--muted)}
.badge{font-family:var(--mono);font-size:.74rem;font-weight:700;border-radius:8px;padding:2px 8px;display:inline-block}
.badge.play{background:rgba(232,200,122,.16);color:var(--gold);border:1px solid var(--gold2)}
.badge.atlas{background:rgba(196,183,157,.1);color:var(--muted);border:1px solid var(--line2)}
.badge.warn{background:rgba(255,157,143,.12);color:var(--danger);border:1px solid #a4574c}
.acard .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
dialog{border:1px solid var(--line2);border-radius:18px;background:var(--panel);color:var(--ink);max-width:min(860px,calc(100vw - 20px));width:100%;padding:0;box-shadow:0 30px 80px #000c}
dialog::backdrop{background:rgba(5,3,1,.78)}
.dlg-in{padding:22px;max-height:calc(100vh - 40px);overflow:auto}
.dlg-in h2{margin:0 0 4px;font-size:1.7rem;line-height:1.1}
.dlg-in h3{font-size:.8rem;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin:18px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.dlg-in ul{margin:0;padding-left:20px}.dlg-in li{margin:4px 0;color:#e4dac4}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0}.facts dt{color:var(--muted);font-family:var(--mono);font-size:.82rem}.facts dd{margin:0}
.warnbox{border:1px solid #a4574c;background:rgba(255,157,143,.07);border-radius:12px;padding:10px 14px;margin-top:12px}
.warnbox strong{color:var(--danger)}
.langnote{font-size:.85rem;color:var(--muted);font-style:italic;margin:6px 0}
.x{position:absolute;right:10px;top:10px}
/* setup */
.setup{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.setup summary{cursor:pointer;font-weight:700;color:var(--gold);min-height:44px;display:flex;align-items:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:10px}
.opt{display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.opt label{color:var(--muted);font-family:var(--mono);font-size:.78rem}
.opt.ck{flex-direction:row;align-items:center;gap:10px;min-height:44px}
.opt.ck input{width:24px;height:24px;flex:none}
.opt.ck label{font-size:.9rem;font-family:var(--serif);color:var(--ink);flex:1;min-height:44px;display:flex;align-items:center;cursor:pointer}
.vnote{font-size:.9rem;color:var(--muted);margin:8px 0 0}
.titlerow{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 16px}
.titlerow .langrow{margin-top:0}
body.playing .sub,body.playing .kick{display:none}
body.playing header.top{padding:8px 0 0}
body.playing h1{font-size:1.6rem;margin:0}
body.playing nav.tabs{margin-top:6px}
body.playing main{padding-top:8px}
body.playing .setup{padding:0 14px;margin-bottom:6px}

body.playing .table{padding:6px 10px;gap:2px}
body.playing .s-s .seat{flex-direction:row;gap:8px;align-items:center}
body.playing .s-s .seat .bubble{display:none}
body.playing .seat.turn:before{inset:-2px}
body.playing .center{align-content:center}
body.playing .t-n{margin-bottom:calc(var(--ch)*-0.24)}body.playing .t-s{margin-top:calc(var(--ch)*-0.24)}
body.playing .hud{margin-bottom:6px}
body.playing .score,body.playing .contract{padding:4px 12px}
body.playing .score .vl{font-size:1.5rem}
body.playing .bigsuit{font-size:2rem}
body.playing .status{min-height:0;padding:6px 12px;margin-bottom:6px}
.s-s{grid-area:s;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.s-s .hand{width:100%}
/* masă */
.hud{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;margin-bottom:10px}
.score{flex:1 1 280px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.score .nm{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.score .vl{font-size:1.9rem;font-weight:700;line-height:1;color:var(--gold)}
.score .vl.opp{color:#f0b9ab}
.score .meta{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.contract{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.bigsuit{font-size:2.6rem;line-height:1;width:54px;text-align:center}
.bigsuit.r{color:#ff8d7d}.bigsuit.k{color:#f0e8d6}
.contract .ct{font-size:.9rem;color:var(--muted)}.contract .cv{font-size:1.1rem;font-weight:700}
.status{min-height:2.7em;background:rgba(232,200,122,.08);border:1px solid var(--line2);border-radius:12px;padding:8px 14px;margin-bottom:10px;font-size:1.05rem}
.table{display:grid;grid-template-columns:minmax(74px,1fr) minmax(0,2.4fr) minmax(74px,1fr);grid-template-areas:". n ." "w c e" "s s s";gap:8px;background:radial-gradient(ellipse at 50% 40%,var(--felt) 0%,var(--felt2) 100%);border:2px solid var(--line2);border-radius:22px;padding:12px;box-shadow:inset 0 0 60px rgba(0,0,0,.55)}
.seat{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.seat .nm{font-family:var(--mono);font-size:.75rem;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.seat .nm .pill{display:inline-block;margin-left:4px;padding:0 6px;border-radius:6px;background:rgba(232,200,122,.18);color:var(--gold);font-size:.68rem}
.seat.turn .nm{color:#fff}.seat.turn:before{content:"";position:absolute;inset:-4px;border:2px solid var(--gold);border-radius:14px;opacity:.7;pointer-events:none}
.s-n{grid-area:n}.s-w{grid-area:w;justify-content:center}.s-e{grid-area:e;justify-content:center}.center{grid-area:c}
.backs{display:flex;justify-content:center;min-height:34px}
.back{width:30px;height:42px;border-radius:5px;border:1px solid #9c8452;background:repeating-linear-gradient(45deg,#6d1f1a 0 4px,#8a2d25 4px 8px);margin-left:-18px;box-shadow:0 1px 2px #000a}
.back:first-child{margin-left:0}
.cnt{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.bubble{min-height:1.5em;font-size:.88rem;background:#0008;border:1px solid var(--line2);border-radius:10px;padding:1px 10px;color:var(--ink);opacity:0}
.bubble.on{opacity:1}
.center{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;grid-template-areas:". tn ." "tw tc te" ". ts .";align-items:center;justify-items:center;gap:4px}
.t-n{grid-area:tn}.t-w{grid-area:tw}.t-e{grid-area:te}.t-s{grid-area:ts}.t-c{grid-area:tc;text-align:center;font-size:.8rem;color:var(--muted)}
.slot{width:calc(var(--cw)*0.7);height:calc(var(--ch)*0.7);display:flex;align-items:center;justify-content:center}
.slot .card{width:100%;height:100%;font-size:calc(var(--cw)*0.7*0.3)}
.t-n{margin-bottom:calc(var(--ch)*-0.2)}.t-s{margin-top:calc(var(--ch)*-0.2)}

  var g = clear($('#agrid'));
  var q = norm(atlasFilter.q);
  var list = ATLAS.filter(function (a) {
    if (atlasFilter.mode === 'play' && !a.play) return false;
    if (atlasFilter.mode === 'atlas' && a.play) return false;
    if (atlasFilter.fam !== 'all' && a.fam !== atlasFilter.fam) return false;
    if (q) {
      var hay = norm([tl(a.name), tl(a.aka), tl(a.region), tl(a.summary), (a.tags || []).join(' '), (a.tags || []).map(tagText).join(' ')].join(' '));
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  $('#acount').textContent = t('atlas_count', { n: list.length, p: ATLAS.filter(function (a) { return a.play; }).length });
  if (!list.length) g.appendChild(el('p', { class: 'vnote', text: t('atlas_none') }));
  list.forEach(function (a) {
    var card = el('article', { class: 'acard' });
    var head = el('div', null, [el('h3', { text: tl(a.name) })]);
    if (a.aka) head.appendChild(el('div', { class: 'aka', text: tl(a.aka) }));
    card.appendChild(head);
    var bs = el('div', { class: 'tags' });
    bs.appendChild(el('span', { class: 'badge ' + (a.play ? 'play' : 'atlas'), text: a.play ? t('badge_play') : t('badge_atlas') }));
    if (a.approx && a.approx.ro.length) bs.appendChild(el('span', { class: 'badge warn', text: '⚠ ' + t('badge_approx') }));
    card.appendChild(bs);
    card.appendChild(el('p', { text: tl(a.summary) }));
    var tg = el('div', { class: 'tags' }); (a.tags || []).forEach(function (x) { tg.appendChild(el('span', { class: 'tag', text: tagText(x) })); });
    card.appendChild(tg);
    var row = el('div', { class: 'row' });
    row.appendChild(el('button', { type: 'button', class: 'btn', text: t('card_sheet'), onclick: function () { openSheet(a.id); } }));
    if (a.play) row.appendChild(el('button', { type: 'button', class: 'btn gold', text: '▶ ' + t('card_play'), onclick: function () { playVariant(a.play); } }));
    card.appendChild(row);
    g.appendChild(card);
  });
}
function openSheet(id) {
  var a = ATLAS.filter(function (x) { return x.id === id; })[0]; if (!a) return;
  var body = clear($('#sheetbody'));
  body.appendChild(el('h2', { text: tl(a.name) }));
  if (a.aka) body.appendChild(el('div', { class: 'aka', text: tl(a.aka) }));
  var badges = el('div', { class: 'tags', style: 'margin:8px 0' });
  badges.appendChild(el('span', { class: 'badge ' + (a.play ? 'play' : 'atlas'), text: a.play ? t('badge_play') : t('badge_atlas') }));
  if (a.approx && a.approx.ro.length) badges.appendChild(el('span', { class: 'badge warn', text: '⚠ ' + t('badge_approx') }));
  body.appendChild(badges);
  var ln = longNote(); if (ln) body.appendChild(ln);
  body.appendChild(el('p', { text: tl(a.summary) }));
  var facts = el('dl', { class: 'facts' });
  [['f_region', a.region], ['f_players', a.players], ['f_deck', a.deck], ['f_bidding', a.bidding], ['f_oblig', a.oblig], ['f_decl', a.decl], ['f_total', a.total], ['f_target', a.target]].forEach(function (p) {
    if (!p[1]) return; facts.appendChild(el('dt', { text: t(p[0]) })); facts.appendChild(el('dd', { text: typeof p[1] === 'string' ? p[1] : tl(p[1]) }));
  });
  body.appendChild(facts);
  function list(titleKey, obj) {
    var arr = obj && (lang === 'ro' ? obj.ro : obj.en); if (!arr || !arr.length) return;
    body.appendChild(el('h3', { text: t(titleKey) }));
    var ul = el('ul'); arr.forEach(function (x) { ul.appendChild(el('li', { text: x })); }); body.appendChild(ul);
  }
  list('sh_rules', a.rules); list('sh_diff', a.diff);
  if (a.approx && a.approx.ro.length) {
    var wb = el('div', { class: 'warnbox' }); wb.appendChild(el('strong', { text: '⚠ ' + t('sh_approx') }));
    var ul2 = el('ul'); (lang === 'ro' ? a.approx.ro : a.approx.en).forEach(function (x) { ul2.appendChild(el('li', { text: x })); }); wb.appendChild(ul2); body.appendChild(wb);
  }
  if (a.sources && a.sources.length) {
    body.appendChild(el('h3', { text: t('sh_sources') }));
    var ul3 = el('ul'); a.sources.forEach(function (s) { ul3.appendChild(el('li', null, [s.label + ' — ', el('code', { text: s.url })])); }); body.appendChild(ul3);
  }
  var row = el('div', { class: 'ctrl' });
  if (a.play) row.appendChild(el('button', { type: 'button', class: 'btn gold', text: '▶ ' + t('card_play'), onclick: function () { closeDialog('#sheet'); playVariant(a.play); } }));
  row.appendChild(el('button', { type: 'button', class: 'btn', text: t('btn_close'), onclick: function () { closeDialog('#sheet'); } }));
  body.appendChild(row);
  openDialog('#sheet');
}

/* ---------- configurare ---------- */
function playVariant(id) {
  App.variant = id; savePrefs();
  setTab('play'); buildSetup(); newMatch();
}
function buildSetup() {
  var cfgB = B.VARIANTS[App.variant], sel = $('#variantsel');
  clear(sel);
  ATLAS.filter(function (a) { return a.play; }).forEach(function (a) { var o = el('option', { value: a.play, text: tl(a.name) }); if (a.play === App.variant) o.selected = true; sel.appendChild(o); });
  var tg = $('#targetsel'); clear(tg);
  var base = B.makeCfg(App.variant);
  var isHands = base.gameEnd.type === 'hands';
  $('#targetlbl').textContent = isHands ? t('opt_hands') : t('opt_target');
  base.targets.forEach(function (v) { var o = el('option', { value: String(v), text: String(v) }); if (v === (App.opts.target || base.gameEnd.value)) o.selected = true; tg.appendChild(o); });
  if (!base.targets.some(function (v) { return v === App.opts.target; })) App.opts.target = base.gameEnd.value;
  var hasDecl = base.decl && typeof base.decl.on === 'boolean' && App.variant !== 'klavA' && App.variant !== 'klavR';
  $('#declwrap').hidden = !hasDecl;
  App.opts.decl = hasDecl ? (App.variant === 'coinche' ? !!App.opts.declCoinche : true) : false;
  $('#declcb0').checked = App.opts.decl;
  $('#dfwrap').hidden = App.variant !== 'ro';
  $('#dfcb').checked = App.opts.dealerForced;
  $('#cutwrap').hidden = App.variant !== 'ro'; $('#cutcb').checked = App.opts.cutPartner;
  $('#tiewrap').hidden = App.variant !== 'ro'; $('#tiecb').checked = App.opts.tieCancel;
  $('#deachwrap').hidden = App.variant !== 'ro' && App.variant !== 'fr';
  $('#deachcb').checked = App.opts.declEach;
  $('#lvlsel').value = String(App.opts.level);
  $('#fourcb').checked = App.opts.four;
  var a = ATLAS.filter(function (x) { return x.play === App.variant; })[0];
  var note = $('#vnote'); clear(note);
  if (a) {
    note.appendChild(document.createTextNode(tl(a.summary) + ' '));
    if (a.approx && a.approx.ro.length) note.appendChild(el('span', { class: 'badge warn', text: '⚠ ' + t('badge_approx') }));
    note.appendChild(document.createTextNode(' '));
    note.appendChild(el('a', { href: '#', text: t('card_sheet'), onclick: function (ev) { ev.preventDefault(); openSheet(a.id); } }));
  }
  renderStats();
}

/* ---------- tab-uri ---------- */
function setTab(name) {
  App.tab = name;
  document.body.classList.toggle('playing', name === 'play');
  ['atlas', 'play', 'about'].forEach(function (n) {
    var v = $('#view-' + n); v.hidden = n !== name;
    var b = $('#tab-' + n); b.setAttribute('aria-selected', n === name ? 'true' : 'false'); b.setAttribute('tabindex', n === name ? '0' : '-1');
  });
  if (name === 'play') { if (!App.cfg) { buildSetup(); newMatch(); } else { render(); } }
  try { window.scrollTo(0, 0); } catch (e) { /* ok */ }
}

/* ---------- despre ---------- */
function renderAbout() {
  var box = clear($('#aboutbox'));
  var ln = longNote(); if (ln) box.appendChild(ln);
  ABOUT.sections.forEach(function (sec) {
    box.appendChild(el('h2', { text: tl(sec.title) }));
    var body = lang === 'ro' ? sec.ro : sec.en;
    body.forEach(function (p) {
      if (typeof p === 'string') box.appendChild(el('p', { text: p }));
      else { var ul = el('ul'); p.forEach(function (x) { ul.appendChild(el('li', { text: x })); }); box.appendChild(ul); }
    });
  });
  box.appendChild(el('h2', { text: t('cmp_title') }));
  var wrap = el('div', { class: 'cmp', tabindex: '0', role: 'region', 'aria-label': t('cmp_title') });
  var tbl = el('table');
  var head = el('tr'); ['cmp_variant', 'f_deck', 'f_bidding', 'f_oblig', 'f_decl', 'f_total', 'f_target', 'cmp_fall'].forEach(function (k) { head.appendChild(el('th', { scope: 'col', text: t(k) })); });
  tbl.appendChild(el('thead', null, [head]));
  var tb = el('tbody');
  ATLAS.forEach(function (a) {
    if (!a.cmp) return;
    var r = el('tr'); r.appendChild(el('th', { scope: 'row', text: tl(a.name) }));
    ['deck', 'bidding', 'oblig', 'decl', 'total', 'target', 'fall'].forEach(function (k) { r.appendChild(el('td', { text: tl(a.cmp[k]) })); });
    tb.appendChild(r);
  });
  tbl.appendChild(tb); wrap.appendChild(tbl); box.appendChild(wrap);
}

/* ---------- limbă ---------- */
function applyLang() {
  document.documentElement.setAttribute('lang', lang);
  $$('[data-i]').forEach(function (n) { n.textContent = t(n.getAttribute('data-i')); });
  $$('[data-iph]').forEach(function (n) { n.setAttribute('placeholder', t(n.getAttribute('data-iph'))); });
  $$('[data-ilabel]').forEach(function (n) { n.setAttribute('aria-label', t(n.getAttribute('data-ilabel'))); });
  document.title = t('app_title') + ' — ' + t('app_sub_short');
  $('#langsel').value = lang;
  var lv = $('#lvlsel'); if (lv) { clear(lv); [0, 1, 2].forEach(function (i) { var o = el('option', { value: String(i), text: t('lvl' + i) }); if (i === App.opts.level) o.selected = true; lv.appendChild(o); }); }
  renderAtlas(); renderAbout(); buildSetup(); render(); renderLog();
  // filtre
  [['all', 'flt_all'], ['play', 'flt_play'], ['atlas', 'flt_atlas']].forEach(function (p) { var b = $('#fm-' + p[0]); if (b) b.textContent = t(p[1]); });
  [['all', 'fam_all'], ['belote', 'fam_belote'], ['jass', 'fam_jass'], ['klav', 'fam_klav'], ['other', 'fam_other']].forEach(function (p) { var b = $('#ff-' + p[0]); if (b) b.textContent = t(p[1]); });
}

/* ---------- inițializare ---------- */
function init() {
  lang = detectLang();
  loadStats(); loadPrefs();
  var ls = $('#langsel');
  LANGS.forEach(function (l) { ls.appendChild(el('option', { value: l, text: LANG_NAMES[l] })); });
  ls.addEventListener('change', function () { lang = ls.value; lsSet('bff_lang', lang); applyLang(); });
  ['atlas', 'play', 'about'].forEach(function (n) { $('#tab-' + n).addEventListener('click', function () { setTab(n); }); });
  $('#tabs').addEventListener('keydown', function (ev) {
    var order = ['atlas', 'play', 'about'], i = order.indexOf(App.tab);
    if (ev.key === 'ArrowRight') { setTab(order[(i + 1) % 3]); $('#tab-' + App.tab).focus(); ev.preventDefault(); }
    else if (ev.key === 'ArrowLeft') { setTab(order[(i + 2) % 3]); $('#tab-' + App.tab).focus(); ev.preventDefault(); }
  });
  $('#q').addEventListener('input', function (e) { atlasFilter.q = e.target.value; renderAtlas(); });
  ['all', 'play', 'atlas'].forEach(function (m) { $('#fm-' + m).addEventListener('click', function () { atlasFilter.mode = m; ['all', 'play', 'atlas'].forEach(function (x) { $('#fm-' + x).setAttribute('aria-pressed', x === m ? 'true' : 'false'); }); renderAtlas(); }); });
  ['all', 'belote', 'jass', 'klav', 'other'].forEach(function (m) { $('#ff-' + m).addEventListener('click', function () { atlasFilter.fam = m; ['all', 'belote', 'jass', 'klav', 'other'].forEach(function (x) { $('#ff-' + x).setAttribute('aria-pressed', x === m ? 'true' : 'false'); }); renderAtlas(); }); });
  $('#variantsel').addEventListener('change', function (e) { App.variant = e.target.value; App.opts.target = 0; savePrefs(); buildSetup(); newMatch(); });
  $('#targetsel').addEventListener('change', function (e) { App.opts.target = parseInt(e.target.value, 10); });
  $('#lvlsel').addEventListener('change', function (e) { App.opts.level = parseInt(e.target.value, 10); savePrefs(); });
  $('#declcb0').addEventListener('change', function (e) { App.opts.decl = e.target.checked; if (App.variant === 'coinche') App.opts.declCoinche = e.target.checked; });
  $('#dfcb').addEventListener('change', function (e) { App.opts.dealerForced = e.target.checked; });
  $('#deachcb').addEventListener('change', function (e) { App.opts.declEach = e.target.checked; });
  $('#cutcb').addEventListener('change', function (e) { App.opts.cutPartner = e.target.checked; });
  $('#tiecb').addEventListener('change', function (e) { App.opts.tieCancel = e.target.checked; });
  $('#seedin').addEventListener('input', function (e) { App.opts.seed = e.target.value; });
  $('#showcb').addEventListener('change', function (e) { App.opts.showHands = e.target.checked; $('#learnnote').hidden = !e.target.checked; render(); });
  $('#fourcb').addEventListener('change', function (e) { App.opts.four = e.target.checked; savePrefs(); render(); });
  $('#newbtn').addEventListener('click', function () { newMatch(); });
  $('#nextbtn').addEventListener('click', function () { if (App.match && App.match.over) newMatch(); else startHand(); });
  $('#hintbtn').addEventListener('click', doHint);
  $('#center').addEventListener('click', function () { if (App.shown) { App.shown = null; clearTimers(); App.token++; step(); } });
  $('#resdlg').addEventListener('close', function () { render(); });
  window.addEventListener('resize', layoutHand);
  document.addEventListener('keydown', function (ev) {
    if (App.tab !== 'play' || ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
    if (ev.key === 'h' || ev.key === 'H') doHint();
    if (App.shown && (ev.key === 'Enter' || ev.key === ' ') && ev.target.tagName === 'BODY') { App.shown = null; clearTimers(); App.token++; step(); }
  });
  applyLang();
  setTab('atlas');
  window.__BFF = { App: App, t: t, step: step, setLang: function (l) { lang = l; applyLang(); }, playVariant: playVariant };
}
document.addEventListener('DOMContentLoaded', init);
})();

</script>
