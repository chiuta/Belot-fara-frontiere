gewählt hat, muss die Gegner übertreffen, sonst ist es „nat“.","Holland klaverjas: a bónuszokat („roem”) ütésenként számolják, ezen kívül a stuk (az adu K+Q) és a pit (minden ütés). Tizenhat leosztást játszanak; az adut választó csapatnak le kell győznie az ellenfeleket, különben „nat”."],"In turn: a suit or pass; the last must choose.":["À tour de rôle : une couleur ou passe ; le dernier doit choisir.","A turno: un seme o passo; l'ultimo deve scegliere.","Por turno: un palo o paso; el último debe elegir.","À vez: um naipe ou passo; o último tem de escolher.","Der Reihe nach: eine Farbe oder passe; der Letzte muss wählen.","Sorban: egy szín vagy passz; az utolsónak választania kell."],"Amsterdam: follow; trump if you cannot; no need to trump over a winning partner (but overtrump an opponent).":["Amsterdam : fournir ; couper si l'on ne peut pas ; pas d'obligation de couper sur un partenaire maître (mais surcouper un adversaire).","Amsterdam: rispondere; tagliare se non si può rispondere; non occorre tagliare sul compagno che sta vincendo (ma si sovrataglia un avversario).","Ámsterdam: servir; fallar si no se puede servir; no hay que fallar sobre el compañero que va ganando (pero sí sobrefallar a un rival).","Amesterdão: assistir; cortar se não puder assistir; não é preciso cortar sobre o parceiro que está a ganhar (mas sobrecorta-se um adversário).","Amsterdam: bedienen; stechen, wenn man nicht bedienen kann; über einen führenden Partner muss man nicht stechen (einen Gegner aber übertrumpfen).","Amszterdam: színt vallani; ha nem lehet, ütni; a nyerő társ fölé nem kell ütni (az ellenfelet viszont felül kell ütni)."],"Roem per trick: 3 in sequence 20, 4 in sequence 50, four alike 100 (jacks 200), stuk 20.":["Roem par pli : 3 à la suite 20, 4 à la suite 50, quatre identiques 100 (valets 200), stuk 20.","Roem per presa: 3 in sequenza 20, 4 in sequenza 50, quattro uguali 100 (jack 200), stuk 20.","Roem por baza: 3 seguidas 20, 4 seguidas 50, cuatro iguales 100 (jotas 200), stuk 20.","Roem por vaza: 3 em sequência 20, 4 em sequência 50, quatro iguais 100 (valetes 200), stuk 20.","Roem pro Stich: 3 in Folge 20, 4 in Folge 50, vier gleiche 100 (Buben 200), Stuk 20.","Roem ütésenként: 3 egymás után 20, 4 egymás után 50, négy egyforma 100 (az alsók 200), stuk 20."],"162 + roem; pit +100":["162 + roem ; pit +100","162 + roem; pit +100","162 + roem; pit +100","162 + roem; pit +100","162 + Roem; Pit +100","162 + roem; pit +100"],"16 hands (8/16/32)":["16 donnes (8/16/32)","16 mani (8/16/32)","16 manos (8/16/32)","16 mãos (8/16/32)","16 Runden (8/16/32)","16 leosztás (8/16/32)"],"Roem is scored per trick for the team winning it.":["Le roem est marqué pli par pli par l'équipe qui le remporte.","Il roem si segna a ogni presa per la squadra che la vince.","El roem se puntúa por baza para el equipo que la gana.","O roem pontua-se por vaza para a equipa que a ganha.","Roem wird pro Stich für das Team gezählt, das ihn gewinnt.","A roem-et ütésenként azon csapat számolja, amelyik az ütést nyeri."],"If the team that chose trump does not score strictly more than the opponents it is “nat”: the opponents take everything (cards + roem).":["Si l'équipe qui a choisi l'atout ne marque pas strictement plus que les adversaires, c'est « nat » : les adversaires prennent tout (cartes + roem).","Se la squadra che ha scelto la briscola non segna strettamente più degli avversari è «nat»: gli avversari prendono tutto (carte + roem).","Si el equipo que eligió el triunfo no puntúa estrictamente más que los rivales, es «nat»: los rivales se llevan todo (cartas + roem).","Se a equipa que escolheu o trunfo não pontuar estritamente mais do que os adversários, é «nat»: os adversários ficam com tudo (cartas + roem).","Erzielt das Team, das den Trumpf gewählt hat, nicht strikt mehr als die Gegner, ist es „nat“: Die Gegner erhalten alles (Karten + Roem).","Ha az adut választó csapat nem szerez szigorúan többet, mint az ellenfelek, „nat”: az ellenfelek viszik az egészet (lapok + roem)."],"Pit (all tricks): +100.":["Pit (tous les plis) : +100.","Pit (tutte le prese): +100.","Pit (todas las bazas): +100.","Pit (todas as vazas): +100.","Pit (alle Stiche): +100.","Pit (minden ütés): +100."],"Rotterdam: you must trump even over your partner. Utrecht, “verzaakt” and other club rules are not covered.":["Rotterdam : on doit couper même sur son partenaire. Utrecht, le « verzaakt » et d'autres règles de club ne sont pas couverts.","Rotterdam: si deve tagliare anche sul compagno. Utrecht, il «verzaakt» e altre regole di club non sono coperti.","Róterdam: hay que fallar incluso sobre el compañero. Utrecht, el «verzaakt» y otras reglas de club no están cubiertos.","Roterdão: é obrigatório cortar mesmo sobre o parceiro. Utrecht, o «verzaakt» e outras regras de clube não estão cobertos.","Rotterdam: Man muss auch über den Partner hinweg stechen. Utrecht, „verzaakt“ und andere Klubregeln sind nicht abgedeckt.","Rotterdam: a társ fölé is kötelező ütni. Utrecht, a „verzaakt” és más klubszabályok nincsenek lefedve."],"The bidding is simplified (the first player who does not pass chooses trump; the last is forced); trump selection differs regionally.":["Les enchères sont simplifiées (le premier joueur qui ne passe pas choisit l'atout ; le dernier est forcé) ; le choix de l'atout varie selon les régions.","La licitazione è semplificata (il primo giocatore che non passa sceglie la briscola; l'ultimo è obbligato); la scelta della briscola varia da regione a regione.","La subasta está simplificada (el primer jugador que no pasa elige el triunfo; el último está obligado); la elección del triunfo varía según la región.","O leilão é simplificado (o primeiro jogador que não passa escolhe o trunfo; o último é obrigado); a escolha do trunfo varia conforme a região.","Die Reizung ist vereinfacht (der erste Spieler, der nicht passt, wählt den Trumpf; der Letzte ist gezwungen); die Trumpfwahl unterscheidet sich regional.","A licit egyszerűsített (az első nem passzoló játékos választja az adut; az utolsó kényszerítve van); az adu megválasztása régiónként eltér."],"No “verzaakt” (renege penalty) and no tournament scoring.":["Pas de « verzaakt » (pénalité pour faute) et pas de comptage de tournoi.","Niente «verzaakt» (penalità per rifiuto) e niente punteggio da torneo.","Sin «verzaakt» (penalización por renuncio) y sin puntuación de torneo.","Sem «verzaakt» (penalização por renúncia) e sem pontuação de torneio.","Kein „verzaakt“ (Strafe fürs Nichtbedienen) und keine Turnierwertung.","Nincs „verzaakt” (szabálytalanság büntetése), és nincs versenypontozás."],"Suit or pass":["Couleur ou passe","Seme o passo","Palo o paso","Naipe ou passo","Farbe oder passe","Szín vagy passz"],"No trump over partner":["Pas de coupe sur le partenaire","Niente taglio sul compagno","Sin fallar sobre el compañero","Sem cortar sobre o parceiro","Nicht über den Partner stechen","A társ fölé nem kell ütni"],"Roem per trick + stuk":["Roem par pli + stuk","Roem a presa + stuk","Roem por baza + stuk","Roem por vaza + stuk","Roem pro Stich + Stuk","Roem ütésenként + stuk"],"162 + roem":["162 + roem","162 + roem","162 + roem","162 + roem","162 + Roem","162 + roem"],"16 hands":["16 donnes","16 mani","16 manos","16 mãos","16 Runden","16 leosztás"],"Nat: opponents take all":["Nat : les adversaires prennent tout","Nat: gli avversari prendono tutto","Nat: los rivales se llevan todo","Nat: os adversários ficam com tudo","Nat: Gegner erhalten alles","Nat: az ellenfelek viszik az egészet"],"Klaverjas (Rotterdam)":["Klaverjas (Rotterdam)","Klaverjas (Rotterdam)","Klaverjas (Róterdam)","Klaverjas (Roterdão)","Klaverjas (Rotterdam)","Klaverjas (Rotterdam)"],"Netherlands (Rotterdam)":["Pays-Bas (Rotterdam)","Paesi Bassi (Rotterdam)","Países Bajos (Róterdam)","Países Baixos (Roterdão)","Niederlande (Rotterdam)","Hollandia (Rotterdam)"],"As Amsterdam, but the obligation to trump also applies over a partner.":["Comme Amsterdam, mais l'obligation de couper s'applique aussi sur un partenaire.","Come Amsterdam, ma l'obbligo di tagliare vale anche sul compagno.","Como Ámsterdam, pero la obligación de fallar se aplica también sobre el compañero.","Como Amesterdão, mas a obrigação de cortar aplica-se também sobre o parceiro.","Wie Amsterdam, aber die Stechpflicht gilt auch über den Partner hinweg.","Mint Amszterdamban, de az ütési kötelezettség a társ fölött is érvényes."],"Same as Amsterdam.":["Comme Amsterdam.","Come Amsterdam.","Igual que Ámsterdam.","Igual a Amesterdão.","Wie Amsterdam.","Ugyanaz, mint Amszterdamban."],"Follow; trump if you cannot; always overtrump if you can, even over a partner.":["Fournir ; couper si l'on ne peut pas ; toujours surcouper si possible, même sur un partenaire.","Rispondere; tagliare se non si può; sovratagliare sempre se si può, anche sul compagno.","Servir; fallar si no se puede; sobrefallar siempre que se pueda, incluso sobre el compañero.","Assistir; cortar se não puder; sobrecortar sempre que possível, mesmo sobre o parceiro.","Bedienen; stechen, wenn man nicht kann; immer übertrumpfen, wenn möglich, auch über den Partner.","Színt vallani; ha nem lehet, ütni; mindig felülütni, ha lehet, még a társ fölött is."],"As Amsterdam except for the trumping obligation.":["Comme Amsterdam, sauf pour l'obligation de couper.","Come Amsterdam, tranne che per l'obbligo di tagliare.","Como Ámsterdam salvo por la obligación de fallar.","Como Amesterdão, exceto na obrigação de cortar.","Wie Amsterdam, außer bei der Stechpflicht.","Mint Amszterdamban, kivéve az ütési kötelezettséget."],"Same approximations as Amsterdam (simplified bidding, no verzaakt).":["Mêmes approximations qu'Amsterdam (enchères simplifiées, pas de verzaakt).","Stesse approssimazioni di Amsterdam (licitazione semplificata, niente verzaakt).","Mismas aproximaciones que Ámsterdam (subasta simplificada, sin verzaakt).","Mesmas aproximações de Amesterdão (leilão simplificado, sem verzaakt).","Dieselben Näherungen wie bei Amsterdam (vereinfachte Reizung, kein verzaakt).","Ugyanazok a közelítések, mint Amszterdamban (egyszerűsített licit, nincs verzaakt)."],"Trump over partner":["Couper sur le partenaire","Tagliare sul compagno","Fallar sobre el compañero","Cortar sobre o parceiro","Über den Partner stechen","A társ fölé is ütni"],"Roem + stuk":["Roem + stuk","Roem + stuk","Roem + stuk","Roem + stuk","Roem + Stuk","Roem + stuk"],"Nat":["Nat","Nat","Nat","Nat","Nat","Nat"],"Jass (Schieber, Switzerland)":["Jass (Schieber, Suisse)","Jass (Schieber, Svizzera)","Jass (Schieber, Suiza)","Jass (Schieber, Suíça)","Jass (Schieber, Schweiz)","Jass (Schieber, Svájc)"],"Switzerland":["Suisse","Svizzera","Suiza","Suíça","Schweiz","Svájc"],"Swiss Jass with a 36-card deck (6–A): trump suit, “obe-abe”, “une-ufe” or “schieben” (pass the choice to your partner); Bauer (J) and Nell (9) as top trumps; weis for sequences; 157 + 5 + 100 match.":["Jass suisse avec un jeu de 36 cartes (6–A) : atout, « obe-abe », « une-ufe » ou « schieben » (passer le choix à son partenaire) ; Bauer (valet) et Nell (9) comme meilleurs atouts ; weis pour les séquences ; match de 157 + 5 + 100.","Jass svizzero con un mazzo da 36 carte (6–A): seme di briscola, «obe-abe», «une-ufe» o «schieben» (passare la scelta al compagno); Bauer (J) e Nell (9) come briscole più alte; weis per le sequenze; partita da 157 + 5 + 100 (match).","Jass suizo con una baraja de 36 cartas (6–A): palo de triunfo, «obe-abe», «une-ufe» o «schieben» (pasar la elección al compañero); Bauer (J) y Nell (9) como mejores triunfos; weis para las secuencias; partida de 157 + 5 + 100 (match).","Jass suíço com um baralho de 36 cartas (6–A): naipe de trunfo, «obe-abe», «une-ufe» ou «schieben» (passar a escolha ao parceiro); Bauer (J) e Nell (9) como trunfos mais altos; weis para as sequências; jogo de 157 + 5 + 100 (match).","Schweizer Jass mit einem 36-Karten-Blatt (6–A): Trumpffarbe, „Obe-abe“, „Une-ufe“ oder „Schieben“ (die Wahl an den Partner weitergeben); Bauer (Bube) und Nell (9) als höchste Trümpfe; Weis für Folgen; 157 + 5 + 100 Match.","Svájci jass 36 lapos paklival (6–A): adu szín, „obe-abe”, „une-ufe” vagy „schieben” (a választást a társra bízni); a Bauer (J) és a Nell (9) a legmagasabb adu; weis a sorokra; 157 + 5 + 100 match."],"36 cards (6–A), 9 each":["36 cartes (6–A), 9 chacun","36 carte (6–A), 9 a testa","36 cartas (6–A), 9 cada uno","36 cartas (6–A), 9 cada um","36 Karten (6–A), je 9","36 lap (6–A), fejenként 9"],"The first player chooses trump / obe-abe / une-ufe or “pushes” to the partner.":["Le premier joueur choisit l'atout / obe-abe / une-ufe ou « pousse » vers son partenaire.","Il primo giocatore sceglie briscola / obe-abe / une-ufe oppure «spinge» al compagno.","El primer jugador elige triunfo / obe-abe / une-ufe o «empuja» al compañero.","O primeiro jogador escolhe trunfo / obe-abe / une-ufe ou «empurra» para o parceiro.","Der erste Spieler wählt Trumpf / Obe-abe / Une-ufe oder „schiebt“ zum Partner.","Az első játékos adut / obe-abe-t / une-ufe-t választ, vagy a társának „tolja”."],"Follow suit; if void you may trump or discard; no under-trumping; if trump is led you must give trump (a lone Bauer is exempt).":["Fournir ; si l'on n'a pas la couleur, on peut couper ou se défausser ; pas de sous-coupe ; si l'atout est demandé, on doit fournir de l'atout (un Bauer seul est dispensé).","Rispondere al seme; se non si ha il seme si può tagliare o scartare; non si può sottotagliare; se si gioca briscola si deve dare briscola (un Bauer solo è esentato).","Servir el palo; si no se tiene, se puede fallar o descartar; no se puede subfallar; si se juega triunfo hay que dar triunfo (un Bauer solo queda exento).","Assistir ao naipe; se não tiver, pode cortar ou descartar; não se pode subcortar; se se jogar trunfo, tem de se dar trunfo (um Bauer isolado fica dispensado).","Die Farbe bedienen; wer nicht kann, darf stechen oder abwerfen; kein Untertrumpfen; wird Trumpf ausgespielt, muss Trumpf gegeben werden (ein einzelner Bauer ist befreit).","Színt vallani; ha nincs, lehet ütni vagy dobni; alulütni tilos; ha adút indítanak, adút kell tenni (az egyedüli Bauer felmentett)."],"Weis: 3 in sequence 20, 4 in sequence 50, 5+ 100, four jacks 200, four nines 150, other fours 100; Stöck 20.":["Weis : 3 à la suite 20, 4 à la suite 50, 5 ou plus 100, quatre valets 200, quatre 9 150, autres carrés 100 ; Stöck 20.","Weis: 3 in sequenza 20, 4 in sequenza 50, 5 o più 100, quattro jack 200, quattro nove 150, altri quattro di un tipo 100; Stöck 20.","Weis: 3 seguidas 20, 4 seguidas 50, 5 o más 100, cuatro jotas 200, cuatro nueves 150, otros cuatro iguales 100; Stöck 20.","Weis: 3 em sequência 20, 4 em sequência 50, 5 ou mais 100, quatro valetes 200, quatro noves 150, outros quatro iguais 100; Stöck 20.","Weis: 3 in Folge 20, 4 in Folge 50, 5 und mehr 100, vier Buben 200, vier Neuner 150, andere Vierlinge 100; Stöck 20.","Weis: 3 egymás után 20, 4 egymás után 50, 5 vagy több 100, négy alsó 200, négy kilences 150, más négyes 100; Stöck 20."],"157 + 5 last trick; match +100":["157 + 5 de dernier pli ; match +100","157 + 5 ultima presa; match +100","157 + 5 de la última baza; match +100","157 + 5 da última vaza; match +100","157 + 5 für den letzten Stich; Match +100","157 + 5 az utolsó ütésért; match +100"],"1500 (1000/3000 optional)":["1500 (1000/3000 en option)","1500 (1000/3000 opzionale)","1500 (1000/3000 opcional)","1500 (1000/3000 opcional)","1500 (1000/3000 optional)","1500 (1000/3000 opcionális)"],"Multipliers: ♠ and ♦ ×2, ♥ and ♣ ×1, obe-abe ×3, une-ufe ×4 (the author’s documented choice). Values: J 20 and 9 14 in trump; in obe-abe/une-ufe the 8 is worth 8.":["Multiplicateurs : ♠ et ♦ ×2, ♥ et ♣ ×1, obe-abe ×3, une-ufe ×4 (choix documenté de l'auteur). Valeurs : valet 20 et 9 14 à l'atout ; en obe-abe/une-ufe, le 8 vaut 8.","Moltiplicatori: ♠ e ♦ ×2, ♥ e ♣ ×1, obe-abe ×3, une-ufe ×4 (scelta documentata dell'autore). Valori: J 20 e 9 14 in briscola; in obe-abe/une-ufe l'8 vale 8.","Multiplicadores: ♠ y ♦ ×2, ♥ y ♣ ×1, obe-abe ×3, une-ufe ×4 (elección documentada del autor). Valores: J 20 y 9 14 en triunfo; en obe-abe/une-ufe el 8 vale 8.","Multiplicadores: ♠ e ♦ ×2, ♥ e ♣ ×1, obe-abe ×3, une-ufe ×4 (escolha documentada do autor). Valores: J 20 e 9 14 em trunfo; em obe-abe/une-ufe o 8 vale 8.","Multiplikatoren: ♠ und ♦ ×2, ♥ und ♣ ×1, Obe-abe ×3, Une-ufe ×4 (dokumentierte Wahl des Autors). Werte: Bube 20 und 9 14 im Trumpf; bei Obe-abe/Une-ufe zählt die 8 acht Punkte.","Szorzók: ♠ és ♦ ×2, ♥ és ♣ ×1, obe-abe ×3, une-ufe ×4 (a szerző dokumentált választása). Értékek: J 20 és 9 14 aduban; obe-abe/une-ufe esetén a 8-as 8 pontot ér."],"Trump led: you must follow with trump (a lone Bauer may be kept). Otherwise follow suit; if void you may trump or discard, but may not under-trump.":["Atout demandé : on doit fournir de l'atout (un Bauer seul peut être gardé). Sinon fournir la couleur ; si l'on n'en a pas, on peut couper ou se défausser, mais sans sous-couper.","Briscola giocata: si deve rispondere con la briscola (un Bauer solo può essere tenuto). Altrimenti rispondere al seme; se non lo si ha si può tagliare o scartare, ma non sottotagliare.","Si se juega triunfo: hay que servir con triunfo (se puede conservar un Bauer solo). Si no, servir el palo; si no se tiene, se puede fallar o descartar, pero sin subfallar.","Trunfo jogado: tem de se assistir com trunfo (um Bauer isolado pode ser guardado). Caso contrário, assistir ao naipe; se não tiver, pode cortar ou descartar, mas sem subcortar.","Trumpf ausgespielt: Es muss mit Trumpf bedient werden (ein einzelner Bauer darf zurückgehalten werden). Sonst die Farbe bedienen; wer nicht kann, darf stechen oder abwerfen, aber nicht untertrumpfen.","Adu indítva: adúval kell kiszolgálni (az egyedüli Bauer megtartható). Egyébként színt vallani; ha nincs, lehet ütni vagy dobni, de alulütni nem szabad."],"Match (all tricks): +100.":["Match (tous les plis) : +100.","Match (tutte le prese): +100.","Match (todas las bazas): +100.","Match (todas as vazas): +100.","Match (alle Stiche): +100.","Match (minden ütés): +100."],"Multipliers and targets differ between regions (French- vs German-suited cards, targets 1000/1500/2500).":["Les multiplicateurs et les objectifs diffèrent selon les régions (cartes françaises ou allemandes, objectifs 1000/1500/2500).","I moltiplicatori e gli obiettivi differiscono da regione a regione (carte francesi o tedesche, obiettivi 1000/1500/2500).","Los multiplicadores y los objetivos difieren según las regiones (barajas francesas o alemanas, objetivos 1000/1500/2500).","Os multiplicadores e os objetivos diferem entre regiões (baralhos de naipes franceses ou alemães, objetivos 1000/1500/2500).","Multiplikatoren und Zielpunkte unterscheiden sich je nach Region (französische oder deutsche Blätter, Ziele 1000/1500/2500).","A szorzók és a célpontszámok régiónként eltérnek (francia vagy német színű lapok, célok: 1000/1500/2500)."],"French-suited cards (♠♥♦♣) instead of Swiss suits; no Differenzler and no Coiffeur.":["Cartes à enseignes françaises (♠♥♦♣) au lieu des enseignes suisses ; ni Differenzler ni Coiffeur.","Carte con semi francesi (♠♥♦♣) invece dei semi svizzeri; niente Differenzler e niente Coiffeur.","Cartas con palos franceses (♠♥♦♣) en lugar de palos suizos; sin Differenzler ni Coiffeur.","Cartas de naipes franceses (♠♥♦♣) em vez de naipes suíços; sem Differenzler nem Coiffeur.","Französische Farben (♠♥♦♣) statt Schweizer Farben; kein Differenzler und kein Coiffeur.","Francia színek (♠♥♦♣) a svájci színek helyett; nincs Differenzler és nincs Coiffeur."],"Suit multipliers and target are the author’s documented choice (see report).":["Les multiplicateurs par couleur et l'objectif sont le choix documenté de l'auteur (voir le rapport).","I moltiplicatori dei semi e l'obiettivo sono la scelta documentata dell'autore (vedi il rapporto).","Los multiplicadores por palo y el objetivo son la elección documentada del autor (véase el informe).","Os multiplicadores por naipe e o objetivo são a escolha documentada do autor (ver o relatório).","Farbmultiplikatoren und Zielpunktzahl sind die dokumentierte Wahl des Autors (siehe Bericht).","A színszorzók és a célpontszám a szerző dokumentált választása (lásd a jelentést)."],"Weis uses simplified rules: only one team scores its weis, the best one wins.":["Le weis suit des règles simplifiées : une seule équipe marque ses weis, le meilleur l'emporte.","Il weis usa regole semplificate: solo una squadra segna i propri weis, vince il migliore.","El weis usa reglas simplificadas: solo un equipo puntúa sus weis, gana el mejor.","O weis usa regras simplificadas: só uma equipa pontua os seus weis, ganha o melhor.","Das Weis verwendet vereinfachte Regeln: Nur ein Team zählt seine Weis, das beste gewinnt.","A weis egyszerűsített szabályokat használ: csak egy csapat számolja el a weis-ét, a legjobb nyer."],"Une-ufe: 6 = 0 points and Ace = 11 (Pagat); many modern tables give 6 = 11 and Ace = 0. In weis a 100-point four-of-a-kind beats a 100-point sequence and a full tie goes to rotation order — neither confirmed in a source. Pagat gives 3000 as the target (1500 = “Schneider”); the default here is 1500.":["Une-ufe : 6 = 0 point et as = 11 (Pagat) ; beaucoup de tables modernes donnent 6 = 11 et as = 0. Au weis, un carré de 100 points bat une séquence de 100 points et une égalité parfaite revient à l'ordre de rotation — deux points non confirmés dans une source. Pagat donne 3000 comme objectif (1500 = « Schneider ») ; la valeur par défaut ici est 1500.","Une-ufe: 6 = 0 punti e asso = 11 (Pagat); molti tavoli moderni danno 6 = 11 e asso = 0. Nel weis un poker da 100 punti batte una sequenza da 100 punti e una parità completa va all'ordine di rotazione — nessuno dei due punti è confermato in una fonte. Pagat indica 3000 come obiettivo (1500 = «Schneider»); qui il valore predefinito è 1500.","Une-ufe: 6 = 0 puntos y as = 11 (Pagat); muchas mesas modernas dan 6 = 11 y as = 0. En el weis, cuatro iguales de 100 puntos vencen a una secuencia de 100 puntos y un empate total pasa al orden de rotación — ninguno de los dos puntos está confirmado en una fuente. Pagat da 3000 como objetivo (1500 = «Schneider»); aquí el valor por defecto es 1500.","Une-ufe: 6 = 0 pontos e ás = 11 (Pagat); muitas mesas modernas dão 6 = 11 e ás = 0. No weis, quatro iguais de 100 pontos batem uma sequência de 100 pontos e um empate total vai para a ordem de rotação — nenhum dos dois pontos está confirmado numa fonte. O Pagat indica 3000 como objetivo (1500 = «Schneider»); aqui o valor predefinido é 1500.","Une-ufe: 6 = 0 Punkte und Ass = 11 (Pagat); viele moderne Tische geben 6 = 11 und Ass = 0. Beim Weis schlägt ein Vierling mit 100 Punkten eine Folge mit 100 Punkten, und ein vollständiger Gleichstand geht an die Rotationsreihenfolge — beides ist in keiner Quelle bestätigt. Pagat nennt 3000 als Ziel (1500 = „Schneider“); hier ist der Standard 1500.","Une-ufe: 6 = 0 pont és ász = 11 (Pagat); sok modern asztalnál 6 = 11 és ász = 0. A weis-ben a 100 pontos négyes üti a 100 pontos sort, a teljes döntetlen pedig a rotációs sorrend szerint dől el — egyiket sem erősíti meg forrás. A Pagat célként 3000-et ad meg (1500 = „Schneider”); itt az alapértelmezés 1500."],"Trump / obe / une / schieben":["Atout / obe / une / schieben","Briscola / obe / une / schieben","Triunfo / obe / une / schieben","Trunfo / obe / une / schieben","Trumpf / Obe / Une / Schieben","Adu / obe / une / schieben"],"Follow; no under-trumping":["Fournir ; pas de sous-coupe","Rispondere; niente sottotaglio","Servir; sin subfallar","Assistir; sem subcortar","Bedienen; kein Untertrumpfen","Színt vallani; alulütni tilos"],"Weis + Stöck":["Weis + Stöck","Weis + Stöck","Weis + Stöck","Weis + Stöck","Weis + Stöck","Weis + Stöck"],"No fall":["Pas de chute","Nessuna caduta","Sin caída","Sem queda","Kein Fall","Nincs bukás"],"Bulgarian Belot":["Belot bulgare","Belot bulgaro","Belot búlgaro","Belot búlgaro","Bulgarisches Belot","Bolgár belot"],"Bulgaria":["Bulgarie","Bulgaria","B pontozással."],"2–4":["2–4","2–4","2–4","2–4","2–4","2–4"],"Trump chosen in turn; belot-like points; the 2-player game has a talon.":["Atout choisi à tour de rôle ; points comme à la belote ; la partie à 2 joueurs comporte un talon.","Briscola scelta a turno; punti simili alla belote; il gioco a 2 giocatori ha un tallone.","Triunfo elegido por turno; puntos similares a la belote; el juego de 2 jugadores tiene un talón.","Trunfo escolhido à vez; pontos semelhantes à belote; o jogo a 2 jogadores tem um talão.","Trumpf wird der Reihe nach gewählt; Punkte wie bei der Belote; das Spiel zu zweit hat einen Talon.","Az adut sorban választják; a belote-hoz hasonló pontok; a kétjátékos játékban van talon."],"Coiffeur (Jass)":["Coiffeur (Jass)","Coiffeur (Jass)","Coiffeur (Jass)","Coiffeur (Jass)","Coiffeur (Jass)","Coiffeur (Jass)"],"A Jass format where each team must play every contract (suit, obe, une) once on a scoreboard.":["Un format de Jass où chaque équipe doit jouer chaque contrat (couleur, obe, une) une fois sur une feuille de marque.","Un formato di Jass in cui ogni squadra deve giocare una volta ogni contratto (seme, obe, une) su un tabellone.","Un formato de Jass en el que cada equipo debe jugar cada contrato (palo, obe, une) una vez en un marcador.","Um formato de Jass em que cada equipa tem de jogar cada contrato (naipe, obe, une) uma vez num marcador.","Ein Jass-Format, bei dem jedes Team jeden Kontrakt (Farbe, Obe, Une) einmal auf einer Tafel spielen muss.","Egy jass-formátum, amelyben minden csapatnak minden szerződést (szín, obe, une) egyszer kell lejátszania egy táblázaton."],"36 cards":["36 cartes","36 carte","36 cartas","36 cartas","36 Karten","36 lap"],"A table of 12 contracts is filled in; each is played once.":["On remplit un tableau de 12 contrats ; chacun est joué une fois.","Si compila una tabella di 12 contratti; ciascuno si gioca una volta.","Se rellena una tabla de 12 contratos; cada uno se juega una vez.","Preenche-se uma tabela de 12 contratos; cada um joga-se uma vez.","Eine Tabelle mit 12 Kontrakten wird ausgefüllt; jeder wird einmal gespielt.","Egy 12 szerződéses táblázatot töltenek ki; mindegyiket egyszer játsszák."],"Atlas only: the engine has no contract table.":["Atlas seulement : le moteur n'a pas de tableau de contrats.","Solo atlante: il motore non ha una tabella dei contratti.","Solo atlas: el motor no tiene tabla de contratos.","Só atlas: o motor não tem tabela de contratos.","Nur Atlas: Dem Spielmotor fehlt eine Kontrakttabelle.","Csak atlasz: a motorban nincs szerződéstáblázat."],"Belot without borders is an atlas of the belote / bela / klaverjas / jass family plus a game: you and an AI partner against two AI opponents, with your hand face up and the rest hidden. Everything runs locally in a single HTML file.":["Belot sans frontières est un atlas de la famille belote / bela / klaverjas / jass, plus un jeu : vous et un partenaire IA contre deux adversaires IA, avec votre main visible et les autres cachées. Tout fonctionne en local, dans un seul fichier HTML.","Belot senza frontiere è un atlante della famiglia belote / bela / klaverjas / jass più un gioco: tu e un compagno IA contro due avversari IA, con la tua mano scoperta e le altre nascoste. Tutto funziona in locale, in un unico file HTML.","Belot sin fronteras es un atlas de la familia belote / bela / klaverjas / jass más un juego: tú y un compañero IA contra dos rivales IA, con tu mano descubierta y las demás ocultas. Todo funciona en local, en un único archivo HTML.","Belot sem fronteiras é um atlas da família belote / bela / klaverjas / jass e também um jogo: tu e um parceiro IA contra dois adversários IA, com a tua mão à vista e as restantes escondidas. Tudo corre localmente, num único ficheiro HTML.","Belot ohne Grenzen ist ein Atlas der Belote-/Bela-/Klaverjas-/Jass-Familie plus ein Spiel: Sie und ein KI-Partner gegen zwei KI-Gegner, mit Ihrer offenen Hand und den übrigen verdeckt. Alles läuft lokal in einer einzigen HTML-Datei.","A Belot határok nélkül a belote / bela / klaverjas / jass család atlasza, plusz egy játék: te és egy MI-társ két MI-ellenfél ellen, a te kezed felfordítva, a többi rejtve. Minden helyben fut, egyetlen HTML-fájlban."],"Priority 1 is Romanian belot for four players, with two bidding rounds, declarations and all follow / trump / overtrump obligations. The other variants use the same parametrised engine: each differs by configuration (bidding, obligations, scoring), not by copied code.":["La priorité 1 est le belot roumain à quatre joueurs, avec deux tours d'enchères, les annonces et toutes les obligations de fournir, couper et surcouper. Les autres variantes utilisent le même moteur paramétré : chacune diffère par sa configuration (enchères, obligations, marque), et non par du code copié.","La priorità 1 è il belot rumeno a quattro giocatori, con due giri di licitazione, dichiarazioni e tutti gli obblighi di rispondere, tagliare e sovratagliare. Le altre varianti usano lo stesso motore parametrico: ognuna si differenzia per configurazione (licitazione, obblighi, punteggio), non per codice copiato.","La prioridad 1 es el belot rumano de cuatro jugadores, con dos rondas de subasta, anuncios y todas las obligaciones de servir, fallar y sobrefallar. Las demás variantes usan el mismo motor parametrizado: cada una se diferencia por su configuración (subasta, obligaciones, puntuación), no por código copiado.","A prioridade 1 é o belot romeno a quatro jogadores, com duas rondas de leilão, anúncios e todas as obrigações de assistir, cortar e sobrecortar. As outras variantes usam o mesmo motor parametrizado: cada uma difere pela configuração (leilão, obrigações, pontuação), não por código copiado.","Priorität 1 ist das rumänische Belot zu viert mit zwei Reizrunden, Ansagen und allen Pflichten zum Bedienen, Stechen und Übertrumpfen. Die anderen Varianten nutzen denselben parametrisierten Spielmotor: Jede unterscheidet sich durch ihre Konfiguration (Reizung, Pflichten, Wertung), nicht durch kopierten Code.","Az 1. prioritás a román négyjátékos belot, két licitkörrel, bemondásokkal és minden színvallási, ütési és felülütési kötelezettséggel. A többi változat ugyanazt a paraméterezett motort használja: mindegyik a beállításaiban (licit, kötelezettségek, pontozás) tér el, nem másolt kódban."],"What it is":["Ce que c'est","Che cos'è","Qué es","O que é","Was es ist","Mi ez"],"The AI never sees hidden hands: it only receives the player’s “view” (own hand, played cards, voids inferred from discards, declarations made). The tests include an automatic check that its decision does not change when the other hands are permuted. The only exception is the explicit “Learning mode: show hands” option – and even then the AI does not use them.":["L'IA ne voit jamais les mains cachées : elle reçoit seulement la « vue » du joueur (sa main, les cartes jouées, les coupes déduites des défausses, les annonces faites). Les tests comprennent une vérification automatique que sa décision ne change pas lorsque les autres mains sont permutées. La seule exception est l'option explicite « Mode apprentissage : montrer les mains » – et même alors, l'IA ne les utilise pas.","L'IA non vede mai le mani nascoste: riceve solo la «vista» del giocatore (la propria mano, le carte giocate, i semi mancanti dedotti dagli scarti, le dichiarazioni fatte). I test comprendono un controllo automatico che la sua decisione non cambi quando le altre mani vengono permutate. L'unica eccezione è l'opzione esplicita «Modalità di apprendimento: mostra le mani» – e anche in quel caso l'IA non le usa.","La IA nunca ve las manos ocultas: solo recibe la «vista» del jugador (su mano, las cartas jugadas, los palos que faltan deducidos de los descartes, los anuncios hechos). Las pruebas incluyen una comprobación automática de que su decisión no cambia al permutar las demás manos. La única excepción es la opción explícita «Modo aprendizaje: mostrar las manos» – e incluso entonces la IA no las usa.","A IA nunca vê as mãos escondidas: recebe apenas a «vista» do jogador (a sua mão, as cartas jogadas, os naipes em falta deduzidos dos descartes, os anúncios feitos). Os testes incluem uma verificação automática de que a sua decisão não muda quando as outras mãos são permutadas. A única exceção é a opção explícita «Modo de aprendizagem: mostrar as mãos» – e mesmo assim a IA não as usa.","Die KI sieht nie verdeckte Hände: Sie erhält nur die „Sicht“ des Spielers (eigene Hand, gespielte Karten, aus Abwürfen erschlossene Fehlfarben, gemachte Ansagen). Die Tests enthalten eine automatische Prüfung, dass sich ihre Entscheidung nicht ändert, wenn die anderen Hände vertauscht werden. Die einzige Ausnahme ist die ausdrückliche Option „Lernmodus: Hände zeigen“ – und selbst dann nutzt die KI sie nicht.","Az MI soha nem látja a rejtett kezeket: csak a játékos „nézőpontját” kapja meg (saját kéz, kijátszott lapok, a dobásokból kikövetkeztetett hiányzó színek, a megtett bemondások). A tesztek automatikus ellenőrzést tartalmaznak arra, hogy a döntése nem változik, ha a többi kezet felcserélik. Az egyetlen kivétel a kifejezett „Tanulómód: kezek mutatása” opció – és még ekkor sem használja őket az MI."],"Three real levels: 0 = a random legal card; 1 = heuristics (trump estimation from the hand, trump counting, partner play: it does not trump the partner’s safe trick, it smears points to the partner); 2 = level 1 plus Monte-Carlo simulations over worlds consistent with what it has seen (PIMC) to choose the card. The level never changes the cards dealt.":["Trois vrais niveaux : 0 = une carte légale au hasard ; 1 = heuristiques (estimation de l'atout d'après la main, comptage des atouts, jeu avec le partenaire : elle ne coupe pas le pli sûr du partenaire, elle fournit des points au partenaire) ; 2 = niveau 1 plus simulations Monte-Carlo sur des mondes cohérents avec ce qu'elle a vu (PIMC) pour choisir la carte. Le niveau ne modifie jamais les cartes distribuées.","Tre livelli reali: 0 = una carta legale a caso; 1 = euristiche (stima della briscola dalla mano, conteggio delle briscole, gioco col compagno: non taglia la presa sicura del compagno, regala punti al compagno); 2 = livello 1 più simulazioni Monte Carlo su mondi coerenti con ciò che ha visto (PIMC) per scegliere la carta. Il livello non cambia mai le carte distribuite.","Tres niveles reales: 0 = una carta legal al azar; 1 = heurísticas (estimación del triunfo a partir de la mano, cuenta de triunfos, juego con el compañero: no falla la baza segura del compañero, le suelta puntos); 2 = nivel 1 más simulaciones de Monte Carlo sobre mundos coherentes con lo que ha visto (PIMC) para elegir la carta. El nivel nunca cambia las cartas repartidas.","Três níveis reais: 0 = uma carta legal ao acaso; 1 = heurísticas (estimativa do trunfo a partir da mão, contagem de trunfos, jogo com o parceiro: não corta a vaza segura do parceiro, larga pontos ao parceiro); 2 = nível 1 mais simulações de Monte Carlo sobre mundos coerentes com o que viu (PIMC) para escolher a carta. O nível nunca altera as cartas distribuídas.","Drei echte Stufen: 0 = eine zufällige regelkonforme Karte; 1 = Heuristiken (Trumpfeinschätzung aus der Hand, Trumpfzählung, Spiel mit dem Partner: Sie sticht den sicheren Stich des Partners nicht, sie schmiert dem Partner Punkte); 2 = Stufe 1 plus Monte-Carlo-Simulationen über Welten, die zu dem Gesehenen passen (PIMC), um die Karte zu wählen. Die Stufe ändert nie die ausgeteilten Karten.","Három valódi szint: 0 = egy véletlen szabályos lap; 1 = heurisztikák (az adu becslése a kézből, aduszámlálás, játék a társsal: nem üti le a társ biztos ütését, pontokat ad a társnak); 2 = az 1. szint plusz Monte Carlo-szimulációk a látottakkal összeegyeztethető világokon (PIMC) a lap kiválasztásához. A szint soha nem változtatja meg a kiosztott lapokat."],"Known limits: level 2 is a good table player, not an expert; bid evaluation relies on short simulations; the AI does not use secret signalling conventions with its partner.":["Limites connues : le niveau 2 est un bon joueur de table, pas un expert ; l'évaluation des enchères repose sur de courtes simulations ; l'IA n'utilise pas de conventions de signaux secrets avec son partenaire.","Limiti noti: il livello 2 è un buon giocatore da tavolo, non un esperto; la valutazione delle offerte si basa su simulazioni brevi; l'IA non usa convenzioni di segnali segreti con il compagno.","Límites conocidos: el nivel 2 es un buen jugador de mesa, no un experto; la evaluación de las pujas se basa en simulaciones cortas; la IA no usa convenciones de señales secretas con su compañero.","Limites conhecidos: o nível 2 é um bom jogador de mesa, não um especialista; a avaliação das licitações assenta em simulações curtas; a IA não usa convenções de sinais secretos com o parceiro.","Bekannte Grenzen: Stufe 2 ist ein guter Tischspieler, kein Experte; die Bewertung der Gebote beruht auf kurzen Simulationen; die KI nutzt keine geheimen Signalabsprachen mit ihrem Partner.","Ismert korlátok: a 2. szint jó asztali játékos, nem szakértő; a licitek értékelése rövid szimulációkra épül; az MI nem használ titkos jelzési megállapodásokat a társával."],"The AI opponents — honest, no cheating":["Les adversaires IA — honnêtes, sans triche","Gli avversari IA — onesti, senza trucchi","Los rivales IA — honestos, sin trampas","Os adversários IA — honestos, sem batota","Die KI-Gegner — ehrlich, ohne Schummeln","Az MI-ellenfelek — tisztességesek, csalás nélkül"],"No network: the page makes no requests (CSP with default-src 'none', no connect-src), no telemetry, no account, no external fonts or images. Cards are drawn in CSS. The only external link is the Buy Me a Coffee one in the corner (opened on click only).":["Aucun réseau : la page n'envoie aucune requête (CSP avec default-src 'none', sans connect-src), pas de télémétrie, pas de compte, pas de polices ni d'images externes. Les cartes sont dessinées en CSS. Le seul lien externe est celui de Buy Me a Coffee dans le coin (ouvert uniquement au clic).","Nessuna rete: la pagina non effettua richieste (CSP con default-src 'none', nessun connect-src), nessuna telemetria, nessun account, nessun font o immagine esterni. Le carte sono disegnate in CSS. L'unico collegamento esterno è quello di Buy Me a Coffee nell'angolo (si apre solo al clic).","Sin red: la página no hace ninguna petición (CSP con default-src 'none', sin connect-src), sin telemetría, sin cuenta, sin fuentes ni imágenes externas. Las cartas se dibujan con CSS. El único enlace externo es el de Buy Me a Coffee en la esquina (se abre solo al hacer clic).","Sem rede: a página não faz pedidos (CSP com default-src 'none', sem connect-src), sem telemetria, sem conta, sem tipos de letra nem imagens externos. As cartas são desenhadas em CSS. A única ligação externa é a do Buy Me a Coffee, no canto (abre-se apenas ao clicar).","Kein Netzwerk: Die Seite stellt keine Anfragen (CSP mit default-src 'none', ohne connect-src), keine Telemetrie, kein Konto, keine externen Schriften oder Bilder. Die Karten werden in CSS gezeichnet. Der einzige externe Link ist der zu Buy Me a Coffee in der Ecke (wird nur auf Klick geöffnet).","Nincs hálózat: az oldal nem küld kéréseket (CSP default-src 'none'-nal, connect-src nélkül), nincs telemetria, nincs fiók, nincsenek külső betűtípusok vagy képek. A lapok CSS-sel vannak megrajzolva. Az egyetlen külső hivatkozás a sarokban lévő Buy Me a Coffee (csak kattintásra nyílik meg)."],"The browser only stores local preferences and statistics (language, AI level, distinct colours, match score) in localStorage inside try/catch blocks; the game works the same without them. Shuffling uses crypto.getRandomValues with rejection sampling; an optional seed (mulberry32) gives reproducible deals.":["Le navigateur ne conserve que des préférences et statistiques locales (langue, niveau de l'IA, couleurs distinctes, score de la partie) dans localStorage, dans des blocs try/catch ; le jeu fonctionne de la même façon sans elles. Le mélange utilise crypto.getRandomValues avec échantillonnage par rejet ; une graine optionnelle (mulberry32) donne des donnes reproductibles.","Il browser conserva solo preferenze e statistiche locali (lingua, livello dell'IA, colori distinti, punteggio della partita) in localStorage, dentro blocchi try/catch; il gioco funziona allo stesso modo senza di esse. Il mescolamento usa crypto.getRandomValues con campionamento per scarto; un seme opzionale (mulberry32) dà distribuzioni riproducibili.","El navegador solo guarda preferencias y estadísticas locales (idioma, nivel de la IA, colores distintos, marcador de la partida) en localStorage, dentro de bloques try/catch; el juego funciona igual sin ellos. El barajado usa crypto.getRandomValues con muestreo por rechazo; una semilla opcional (mulberry32) da repartos reproducibles.","O navegador só guarda preferências e estatísticas locais (idioma, nível da IA, cores distintas, resultado do jogo) em localStorage, dentro de blocos try/catch; o jogo funciona da mesma forma sem elas. A baralhação usa crypto.getRandomValues com amostragem por rejeição; uma semente opcional (mulberry32) dá distribuições reprodutíveis.","Der Browser speichert nur lokale Einstellungen und Statistiken (Sprache, KI-Stufe, unterscheidbare Farben, Spielstand) in localStorage, in try/catch-Blöcken; das Spiel funktioniert ohne sie genauso. Das Mischen verwendet crypto.getRandomValues mit Rejection Sampling; ein optionaler Seed (mulberry32) liefert reproduzierbare Austeilungen.","A böngésző csak helyi beállításokat és statisztikákat (nyelv, MI-szint, megkülönböztethető színek, a parti állása) tárol a localStorage-ban, try/catch blokkokban; a játék nélkülük is ugyanúgy működik. A keverés a crypto.getRandomValues függvényt használja elutasításos mintavétellel; egy opcionális mag (mulberry32) megismételhető osztásokat ad."],"The CSP allows inline scripts only by sha256 hash (computed at build time); style-src 'unsafe-inline' is needed for the page styles.":["La CSP n'autorise les scripts en ligne que par hachage sha256 (calculé à la construction) ; style-src 'unsafe-inline' est nécessaire pour les styles de la page.","La CSP consente gli script inline solo tramite hash sha256 (calcolato in fase di build); style-src 'unsafe-inline' serve per gli stili della pagina.","La CSP permite scripts en línea solo mediante hash sha256 (calculado al compilar); style-src 'unsafe-inline' es necesario para los estilos de la página.","A CSP só permite scripts em linha por hash sha256 (calculado na compilação); style-src 'unsafe-inline' é necessário para os estilos da página.","Die CSP erlaubt Inline-Skripte nur per sha256-Hash (beim Build berechnet); style-src 'unsafe-inline' wird für die Seitenstile benötigt.","A CSP az inline szkripteket csak sha256-hash alapján engedi (összeállításkor számolva); az oldal stílusaihoz style-src 'unsafe-inline' szükséges."],"Privacy and network":["Confidentialité et réseau","Privacy e rete","Privacidad y red","Privacidade e rede","Datenschutz und Netzwerk","Adatvédelem és hálózat"],"Belot has no single official rulebook: tables in Romania differ. The rules chosen here are documented on each variant sheet, with ⚠ for every approximation.":["Le belot n'a pas de règlement officiel unique : les tables diffèrent en Roumanie. Les règles retenues ici sont documentées sur la fiche de chaque variante, avec ⚠ pour chaque approximation.","Il belot non ha un unico regolamento ufficiale: i tavoli in Romania differiscono. Le regole scelte qui sono documentate nella scheda di ogni variante, con ⚠ per ogni approssimazione.","El belot no tiene un reglamento oficial único: las mesas de Rumanía difieren. Las reglas elegidas aquí están documentadas en la ficha de cada variante, con ⚠ para cada aproximación.","O belot não tem um regulamento oficial único: as mesas na Roménia diferem. As regras escolhidas aqui estão documentadas na ficha de cada variante, com ⚠ para cada aproximação.","Belot hat kein einheitliches offizielles Regelwerk: Die Tische in Rumänien unterscheiden sich. Die hier gewählten Regeln sind auf dem Blatt jeder Variante dokumentiert, mit ⚠ bei jeder Näherung.","A belotnak nincs egységes hivatalos szabálykönyve: a romániai asztalok eltérnek. Az itt választott szabályokat minden változat lapja dokumentálja, minden közelítésnél ⚠ jelöléssel."],"Rules were checked against public pages (Pagat, belot.md, belot.bg, Wikipedia) read through automated summaries, not by consulting printed rulebooks; regional nuances may be summarised wrongly.":["Les règles ont été vérifiées sur des pages publiques (Pagat, belot.md, belot.bg, Wikipédia) lues au moyen de résumés automatisés, et non en consultant des règlements imprimés ; des nuances régionales peuvent être mal résumées.","Le regole sono state verificate su pagine pubbliche (Pagat, belot.md, belot.bg, Wikipedia) lette tramite riassunti automatici, non consultando regolamenti stampati; le sfumature regionali potrebbero essere riassunte in modo errato.","Las reglas se comprobaron en páginas públicas (Pagat, belot.md, belot.bg, Wikipedia) leídas mediante resúmenes automáticos, no consultando reglamentos impresos; los matices regionales pueden estar mal resumidos.","As regras foram verificadas em páginas públicas (Pagat, belot.md, belot.bg, Wikipédia) lidas através de resumos automáticos, e não consultando regulamentos impressos; as nuances regionais podem estar mal resumidas.","Die Regeln wurden anhand öffentlicher Seiten (Pagat, belot.md, belot.bg, Wikipedia) geprüft, die über automatische Zusammenfassungen gelesen wurden, nicht anhand gedruckter Regelwerke; regionale Feinheiten können falsch zusammengefasst sein.","A szabályokat nyilvános oldalakon (Pagat, belot.md, belot.bg, Wikipédia) ellenőrizték automatikus összefoglalókon keresztül, nem nyomtatott szabálykönyvek alapján; a regionális árnyalatok rosszul lehetnek összefoglalva."],"This is not a gambling game: there is no money, prize or account.":["Ce n'est pas un jeu d'argent : il n'y a ni argent, ni prix, ni compte.","Non è un gioco d'azzardo: non ci sono denaro, premi né account.","No es un juego de azar: no hay dinero, premios ni cuenta.","Não é um jogo de azar: não há dinheiro, prémios nem conta.","Dies ist kein Glücksspiel: Es gibt kein Geld, keinen Preis und kein Konto.","Ez nem szerencsejáték: nincs pénz, nyeremény vagy fiók."],"The AI can make mistakes, especially in bidding, where simulations are short.":["L'IA peut se tromper, surtout aux enchères, où les simulations sont courtes.","L'IA può sbagliare, soprattutto nella licitazione, dove le simulazioni sono brevi.","La IA puede equivocarse, sobre todo en la subasta, donde las simulaciones son cortas.","A IA pode cometer erros, sobretudo no leilão, onde as simulações são curtas.","Die KI kann Fehler machen, besonders beim Reizen, wo die Simulationen kurz sind.","Az MI hibázhat, különösen a licitálásnál, ahol a szimulációk rövidek."],"For tournaments or games with stakes, check your own table’s rules.":["Pour des tournois ou des parties avec enjeu, vérifiez les règles de votre propre table.","Per tornei o partite con una posta in gioco, controlla le regole del tuo tavolo.","Para torneos o partidas con apuestas, comprueba las reglas de tu propia mesa.","Para torneios ou jogos com apostas, verifica as regras da tua própria mesa.","Prüfen Sie bei Turnieren oder Spielen um einen Einsatz die Regeln Ihres eigenen Tisches.","Versenyekhez vagy tétre menő játékokhoz ellenőrizd a saját asztalod szabályait."],"Limits and warnings":["Limites et avertissements","Limiti e avvertenze","Límites y advertencias","Limites e avisos","Grenzen und Warnhinweise","Korlátok és figyelmeztetések"],"Belot.md: reguli_new.php. belot.bg: rules-belot. Wikipedia RO/EN/FR/HR (Belot, Belote contrée, Klaverjas).":["Belot.md : reguli_new.php. belot.bg : rules-belot. Wikipédia RO/EN/FR/HR (Belot, Belote contrée, Klaverjas).","Belot.md: reguli_new.php. belot.bg: rules-belot. Wikipedia RO/EN/FR/HR (Belot, B }

  try { a = AI.act(st, lv, App.aiRng, { worlds: 14 }); } catch (e) { a = null; }
  try {
    if (!a) throw new Error('AI');
    if (a.kind === 'bid') doBid(a.act, seat); else doPlay(a.card, a.declare, seat);
  } catch (e) { // plasă de siguranță: dacă AI-ul eșuează sau propune ceva ilegal, joacă nivelul 0 (legal la întâmplare), ca jocul să nu se blocheze

}

  }
  if (st.cfg.scoring === 'coinche') body.appendChild(el('p', { class: 'vnote', text: t('res_coinche', { v: r.contract === 250 ? t('capot') : r.contract, c: r.contra }) }));
  var sc = el('p', { class: 'resmsg', text: t('res_score', { a: applied.score[0], b: applied.score[1] }) });
  body.appendChild(sc);
  if (App.hist && App.hist.length > 1) {
    var sh = el('table', { class: 'res sheet' });
    sh.appendChild(el('caption', { text: t('res_sheet') }));
    sh.appendChild(el('thead', null, [el('tr', null, [el('th', { scope: 'col', text: t('res_hand') }), el('th', { scope: 'col', text: t('res_we') }), el('th', { scope: 'col', text: t('res_they') })])]));
    var sb = el('tbody');
    App.hist.forEach(function (h) {
      sb.appendChild(el('tr', null, [el('td', { text: String(h.n) }), el('td', { text: (h.d[0] >= 0 ? '+' : '') + h.d[0] + ' → ' + h.s[0] }), el('td', { text: (h.d[1] >= 0 ? '+' : '') + h.d[1] + ' → ' + h.s[1] })]));
    });
    sh.appendChild(sb); body.appendChild(sh);
  }
  var btns = el('div', { class: 'ctrl' });
  if (applied.over) {
    var win = applied.winner;
    body.appendChild(el('p', { class: 'resmsg ' + (win === 0 ? 'good' : 'bad'), text: win === -1 ? t('res_draw') : (win === 0 ? t('res_matchwin') : t('res_matchlose')) }));
    recordStats(win);
    btns.appendChild(el('button', { type: 'button', class: 'btn gold', text: t('btn_newmatch'), onclick: function () { closeDialog('#resdlg'); newMatch(); } }));
    App.matchOver = true;
    App.match = applied;
  } else {
    btns.appendChild(el('button', { type: 'button', class: 'btn gold', id: 'nexthand', text: t('btn_nexthand'), onclick: function () { closeDialog('#resdlg'); App.match = applied; startHand(); } }));
  }
  btns.appendChild(el('button', { type: 'button', class: 'btn', text: t('btn_close'), onclick: function () { closeDialog('#resdlg'); if (!applied.over) { App.match = applied; } } }));
  body.appendChild(btns);
  openDialog('#resdlg');
  render();
}
function recordStats(win) {
  var id = App.variant, s = stats[id] || (stats[id] = { played: 0, won: 0, lost: 0 });
  s.played++; if (win === 0) s.won++; else if (win === 1) s.lost++;
  saveStats(); renderStats();
}
function renderStats() {
  var box = $('#statsline'); if (!box) return;
  var s = stats[App.variant] || { played: 0, won: 0, lost: 0 };
  box.textContent = t('stats_line', { p: s.played, w: s.won, l: s.lost });
}

/* ---------- dialoguri ---------- */
function openDialog(sel) { var d = $(sel); if (!d) return; try { if (d.showModal) { if (!d.open) d.showModal(); } else d.setAttribute('open', ''); } catch (e) { d.setAttribute('open', ''); } }
function closeDialog(sel) { var d = $(sel); if (!d) return; try { if (d.close) d.close(); else d.removeAttribute('open'); } catch (e) { d.removeAttribute('open'); } }

/* ---------- atlas ---------- */
var atlasFilter = { q: '', mode: 'all', fam: 'all' };
function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function renderAtlas() {
  var g = clear($('#agrid'));
  var q = norm(atlasFilter.q);
  var list = ATLAS.filter(function (a) {
    if (atlasFilter.mode === 'play' && !a.play) return false;
    if (atlasFilter.mode === 'atlas' && a.play) return false;
    if (atlasFilter.fam !== 'all' && a.fam !== atlasFilter.fam) return false;
    if (q) {
      var hay = norm([tl(a.name), tl(a.aka), tl(a.region), tl(a.summary), (a.tags || []).join(' '), (a.tags || []).map(tagText).join(' ')].join(' '));
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  $('#acount').textContent = t('atlas_count', { n: list.length, p: ATLAS.filter(function (a) { return a.play; }).length });
  if (!list.length) g.appendChild(el('p', { class: 'vnote', text: t('atlas_none') }));
  list.forEach(function (a) {
    var card = el('article', { class: 'acard' });
    var head = el('div', null, [el('h3', { text: tl(a.name) })]);
    if (a.aka) head.appendChild(el('div', { class: 'aka', text: tl(a.aka) }));
    card.appendChild(head);
    var bs = el('div', { class: 'tags' });
    bs.appendChild(el('span', { class: 'badge ' + (a.play ? 'play' : 'atlas'), text: a.play ? t('badge_play') : t('badge_atlas') }));
    if (a.approx && a.approx.ro.length) bs.appendChild(el('span', { class: 'badge warn', text: '⚠ ' + t('badge_approx') }));
    card.appendChild(bs);
    card.appendChild(el('p', { text: tl(a.summary) }));
    var tg = el('div', { class: 'tags' }); (a.tags || []).forEach(function (x) { tg.appendChild(el('span', { class: 'tag', text: tagText(x) })); });
    card.appendChild(tg);
    var row = el('div', { class: 'row' });
    row.appendChild(el('button', { type: 'button', class: 'btn', text: t('card_sheet'), onclick: function () { openSheet(a.id); } }));
    if (a.play) row.appendChild(el('button', { type: 'button', class: 'btn gold', text: '▶ ' + t('card_play'), onclick: function () { playVariant(a.play); } }));
    card.appendChild(row);
    g.appendChild(card);
  });
}
function openSheet(id) {
  var a = ATLAS.filter(function (x) { return x.id === id; })[0]; if (!a) return;
  var body = clear($('#sheetbody'));
  body.appendChild(el('h2', { text: tl(a.name) }));
  if (a.aka) body.appendChild(el('div', { class: 'aka', text: tl(a.aka) }));
  var badges = el('div', { class: 'tags', style: 'margin:8px 0' });
  badges.appendChild(el('span', { class: 'badge ' + (a.play ? 'play' : 'atlas'), text: a.play ? t('badge_play') : t('badge_atlas') }));
  if (a.approx && a.approx.ro.length) badges.appendChild(el('span', { class: 'badge warn', text: '⚠ ' + t('badge_approx') }));
  body.appendChild(badges);
  var ln = longNote(); if (ln) body.appendChild(ln);
  body.appendChild(el('p', { text: tl(a.summary) }));
  var facts = el('dl', { class: 'facts' });
  [['f_region', a.region], ['f_players', a.players], ['f_deck', a.deck], ['f_bidding', a.bidding], ['f_oblig', a.oblig], ['f_decl', a.decl], ['f_total', a.total], ['f_target', a.target]].forEach(function (p) {
    if (!p[1]) return; facts.appendChild(el('dt', { text: t(p[0]) })); facts.appendChild(el('dd', { text: typeof p[1] === 'string' ? p[1] : tl(p[1]) }));
  });
  body.appendChild(facts);
  function list(titleKey, obj) {
    var arr = tla(obj); if (!arr || !arr.length) return;
    body.appendChild(el('h3', { text: t(titleKey) }));
    var ul = el('ul'); arr.forEach(function (x) { ul.appendChild(el('li', { text: x })); }); body.appendChild(ul);
  }
  list('sh_rules', a.rules); list('sh_diff', a.diff);
  if (a.approx && a.approx.ro.length) {
    var wb = el('div', { class: 'warnbox' }); wb.appendChild(el('strong', { text: '⚠ ' + t('sh_approx') }));
    var ul2 = el('ul'); tla(a.approx).forEach(function (x) { ul2.appendChild(el('li', { text: x })); }); wb.appendChild(ul2); body.appendChild(wb);
  }
  if (a.sources && a.sources.length) {
    body.appendChild(el('h3', { text: t('sh_sources') }));
    var ul3 = el('ul'); a.sources.forEach(function (s) { ul3.appendChild(el('li', null, [s.label + ' — ', el('code', { text: s.url })])); }); body.appendChild(ul3);
  }
  var row = el('div', { class: 'ctrl' });
  if (a.play) row.appendChild(el('button', { type: 'button', class: 'btn gold', text: '▶ ' + t('card_play'), onclick: function () { closeDialog('#sheet'); playVariant(a.play); } }));
  row.appendChild(el('button', { type: 'button', class: 'btn', text: t('btn_close'), onclick: function () { closeDialog('#sheet'); } }));
  body.appendChild(row);
  openDialog('#sheet');
}

/* ---------- configurare ---------- */
function playVariant(id) {
  App.variant = id; savePrefs();
  setTab('play'); buildSetup(); newMatch();
}
function buildSetup() {
  var cfgB = B.VARIANTS[App.variant], sel = $('#variantsel');
  clear(sel);
  ATLAS.filter(function (a) { return a.play; }).forEach(function (a) { var o = el('option', { value: a.play, text: tl(a.name) }); if (a.play === App.variant) o.selected = true; sel.appendChild(o); });
  var tg = $('#targetsel'); clear(tg);
  var base = B.makeCfg(App.variant);
  var isHands = base.gameEnd.type === 'hands';
  $('#targetlbl').textContent = isHands ? t('opt_hands') : t('opt_target');
  base.targets.forEach(function (v) { var o = el('option', { value: String(v), text: String(v) }); if (v === (App.opts.target || base.gameEnd.value)) o.selected = true; tg.appendChild(o); });
  if (!base.targets.some(function (v) { return v === App.opts.target; })) App.opts.target = base.gameEnd.value;
  var hasDecl = base.decl && typeof base.decl.on === 'boolean' && App.variant !== 'klavA' && App.variant !== 'klavR';
  $('#declwrap').hidden = !hasDecl;
  App.opts.decl = hasDecl ? (App.variant === 'coinche' ? !!App.opts.declCoinche : true) : false;
  $('#declcb0').checked = App.opts.decl;
  $('#dfwrap').hidden = App.variant !== 'ro';
  $('#dfcb').checked = App.opts.dealerForced;
  $('#cutwrap').hidden = App.variant !== 'ro'; $('#cutcb').checked = App.opts.cutPartner;
  $('#tiewrap').hidden = App.variant !== 'ro'; $('#tiecb').checked = App.opts.tieCancel;
  $('#deachwrap').hidden = App.variant !== 'ro' && App.variant !== 'fr';
  $('#deachcb').checked = App.opts.declEach;
  $('#lvlsel').value = String(App.opts.level);
  $('#fourcb').checked = App.opts.four;
  var a = ATLAS.filter(function (x) { return x.play === App.variant; })[0];
  var note = $('#vnote'); clear(note);
  if (a) {
    note.appendChild(document.createTextNode(tl(a.summary) + ' '));
    if (a.approx && a.approx.ro.length) note.appendChild(el('span', { class: 'badge warn', text: '⚠ ' + t('badge_approx') }));
    note.appendChild(document.createTextNode(' '));
    note.appendChild(el('a', { href: '#', text: t('card_sheet'), onclick: function (ev) { ev.preventDefault(); openSheet(a.id); } }));
  }
  renderStats();
}

/* ---------- tab-uri ---------- */
function setTab(name) {
  App.tab = name;
  document.body.classList.toggle('playing', name === 'play');
  ['atlas', 'play', 'about'].forEach(function (n) {
    var v = $('#view-' + n); v.hidden = n !== name;
    var b = $('#tab-' + n); b.setAttribute('aria-selected', n === name ? 'true' : 'false'); b.setAttribute('tabindex', n === name ? '0' : '-1');
  });
  if (name === 'play') { if (!App.cfg) { buildSetup(); newMatch(); } else { render(); } }
  try { window.scrollTo(0, 0); } catch (e) { /* ok */ }
}

/* ---------- despre ---------- */
function renderAbout() {
  var box = clear($('#aboutbox'));
  var ln = longNote(); if (ln) box.appendChild(ln);
  ABOUT.sections.forEach(function (sec) {
    box.appendChild(el('h2', { text: tl(sec.title) }));
    var body = tla(sec);
    body.forEach(function (p) {
      if (typeof p === 'string') box.appendChild(el('p', { text: p }));
      else { var ul = el('ul'); p.forEach(function (x) { ul.appendChild(el('li', { text: x })); }); box.appendChild(ul); }
    });
  });
  box.appendChild(el('h2', { text: t('cmp_title') }));
  var wrap = el('div', { class: 'cmp', tabindex: '0', role: 'region', 'aria-label': t('cmp_title') });
  var tbl = el('table');
  var head = el('tr'); ['cmp_variant', 'f_deck', 'f_bidding', 'f_oblig', 'f_decl', 'f_total', 'f_target', 'cmp_fall'].forEach(function (k) { head.appendChild(el('th', { scope: 'col', text: t(k) })); });
  tbl.appendChild(el('thead', null, [head]));
  var tb = el('tbody');
  ATLAS.forEach(function (a) {
    if (!a.cmp) return;
    var r = el('tr'); r.appendChild(el('th', { scope: 'row', text: tl(a.name) }));
    ['deck', 'bidding', 'oblig', 'decl', 'total', 'target', 'fall'].forEach(function (k) { r.appendChild(el('td', { text: tl(a.cmp[k]) })); });
    tb.appendChild(r);
  });
  tbl.appendChild(tb); wrap.appendChild(tbl); box.appendChild(wrap);
}

/* ---------- limbă ---------- */
function applyLang() {
  document.documentElement.setAttribute('lang', lang);
  $$('[data-i]').forEach(function (n) { n.textContent = t(n.getAttribute('data-i')); });
  $$('[data-iph]').forEach(function (n) { n.setAttribute('placeholder', t(n.getAttribute('data-iph'))); });
  $$('[data-ilabel]').forEach(function (n) { n.setAttribute('aria-label', t(n.getAttribute('data-ilabel'))); });
  document.title = t('app_title') + ' — ' + t('app_sub_short');
  $('#langsel').value = lang;
  var lv = $('#lvlsel'); if (lv) { clear(lv); [0, 1, 2].forEach(function (i) { var o = el('option', { value: String(i), text: t('lvl' + i) }); if (i === App.opts.level) o.selected = true; lv.appendChild(o); }); }
  renderAtlas(); renderAbout(); buildSetup(); render(); renderLog();
  // filtre
  [['all', 'flt_all'], ['play', 'flt_play'], ['atlas', 'flt_atlas']].forEach(function (p) { var b = $('#fm-' + p[0]); if (b) b.textContent = t(p[1]); });
  [['all', 'fam_all'], ['belote', 'fam_belote'], ['jass', 'fam_jass'], ['klav', 'fam_klav'], ['other', 'fam_other']].forEach(function (p) { var b = $('#ff-' + p[0]); if (b) b.textContent = t(p[1]); });
}

/* ---------- inițializare ---------- */
function init() {
  lang = detectLang();
  loadStats(); loadPrefs();
  var ls = $('#langsel');
  LANGS.forEach(function (l) { ls.appendChild(el('option', { value: l, text: LANG_NAMES[l] })); });
  ls.addEventListener('change', function () { lang = ls.value; lsSet('bff_lang', lang); applyLang(); });
  ['atlas', 'play', 'about'].forEach(function (n) { $('#tab-' + n).addEventListener('click', function () { setTab(n); }); });
  $('#tabs').addEventListener('keydown', function (ev) {
    var order = ['atlas', 'play', 'about'], i = order.indexOf(App.tab);
    if (ev.key === 'ArrowRight') { setTab(order[(i + 1) % 3]); $('#tab-' + App.tab).focus(); ev.preventDefault(); }
    else if (ev.key === 'ArrowLeft') { setTab(order[(i + 2) % 3]); $('#tab-' + App.tab).focus(); ev.preventDefault(); }
  });
  $('#q').addEventListener('input', function (e) { atlasFilter.q = e.target.value; renderAtlas(); });
  ['all', 'play', 'atlas'].forEach(function (m) { $('#fm-' + m).addEventListener('click', function () { atlasFilter.mode = m; ['all', 'play', 'atlas'].forEach(function (x) { $('#fm-' + x).setAttribute('aria-pressed', x === m ? 'true' : 'false'); }); renderAtlas(); }); });
  ['all', 'belote', 'jass', 'klav', 'other'].forEach(function (m) { $('#ff-' + m).addEventListener('click', function () { atlasFilter.fam = m; ['all', 'belote', 'jass', 'klav', 'other'].forEach(function (x) { $('#ff-' + x).setAttribute('aria-pressed', x === m ? 'true' : 'false'); }); renderAtlas(); }); });
  $('#variantsel').addEventListener('change', function (e) { App.variant = e.target.value; App.opts.target = 0; savePrefs(); buildSetup(); newMatch(); });
  $('#targetsel').addEventListener('change', function (e) { App.opts.target = parseInt(e.target.value, 10); });
  $('#lvlsel').addEventListener('change', function (e) { App.opts.level = parseInt(e.target.value, 10); savePrefs(); });
  $('#declcb0').addEventListener('change', function (e) { App.opts.decl = e.target.checked; if (App.variant === 'coinche') App.opts.declCoinche = e.target.checked; });
  $('#dfcb').addEventListener('change', function (e) { App.opts.dealerForced = e.target.checked; });
  $('#deachcb').addEventListener('change', function (e) { App.opts.declEach = e.target.checked; });
  $('#cutcb').addEventListener('change', function (e) { App.opts.cutPartner = e.target.checked; });
  $('#tiecb').addEventListener('change', function (e) { App.opts.tieCancel = e.target.checked; });
  $('#seedin').addEventListener('input', function (e) { App.opts.seed = e.target.value; });
  $('#showcb').addEventListener('change', function (e) { App.opts.showHands = e.target.checked; $('#learnnote').hidden = !e.target.checked; render(); });
  $('#fourcb').addEventListener('change', function (e) { App.opts.four = e.target.checked; savePrefs(); render(); });
  $('#newbtn').addEventListener('click', function () { newMatch(); });
  $('#nextbtn').addEventListener('click', function () { if (App.match && App.match.over) newMatch(); else startHand(); });
  $('#hintbtn').addEventListener('click', doHint);
  $('#center').addEventListener('click', function () { if (App.shown) { App.shown = null; clearTimers(); App.token++; step(); } });
  $('#resdlg').addEventListener('close', function () { render(); });
  window.addEventListener('resize', layoutHand);
  document.addEventListener('keydown', function (ev) {
    if (App.tab !== 'play' || ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
    if (ev.key === 'h' || ev.key === 'H') doHint();
    if (App.shown && (ev.key === 'Enter' || ev.key === ' ') && ev.target.tagName === 'BODY') { App.shown = null; clearTimers(); App.token++; step(); }
  });
  applyLang();
  setTab('atlas');
  window.__BFF = { App: App, t: t, step: step, setLang: function (l) { lang = l; applyLang(); }, playVariant: playVariant };
}
document.addEventListener('DOMContentLoaded', init);
})();

</script>
